ins the phone number to ring (e.g. '0201234567'). Only when joining a session (see below) do you need to provide a phone number.","initializes a serial connection. portno is the port number (1-4). baudrate is the baudrate to be used (100-256K). stopbits indicates the number of stopbits (0 = 1 bit, 1 = 1.5 bit, 2 = 2 bits). parity indicates the parity (0=none, 1=odd, 2=even, 3=mark). And flow indicates the type of flow control (0=none, 1=xon/xoff, 2=rts, 3=dtr, 4=rts and dtr). Returns whether successful. A typical call is mplay_init_serial(1,57600,0,0,4). Give 0 as a first argument to open a dialog for the user to change the settings.","initializes a TCP/IP connection. addr is a string containing the web address or IP address, e.g. 'www.gameplay.com' or '123.123.123.12', possibly followed by a port number (e.g. ':12'). Only when joining a session (see below) do you need to provide an address. On a local area network no addresses are necessary.","returns the IP address of your machine (e.g. '123.123.123.12') as a string. You can e.g. display this somewhere on the screen. Note that this routine is slow so don't call it all the time.","Removes all messages left in the queue from the player (use 0 to remove all message).","Returns the number of messages left in the queue from the player (use 0 to count all message).","Returns the identifier of the last received message.","Returns the name of the player who sent the last received message.","Returns the player who sent the last received message.","receives the next message from the message queue that came from the indicated player (either an identifier or a name). Use 0 for messages from any player. The routine returns whether there was indeed a new message. If so you can use the following routines to get its contents:","sends a message to the indicated player (either an identifier or a name; use 0 to send the message to all players). id is an integer message identifier and val is the value (either a real or a string). The message is sent in non-guaranteed mode. If val contains a string the maximal string length allowed is 30000 characters.","sends a message to the indicated player (either an identifier or a name; use 0 to send the message to all players). id is an integer message identifier and val is the value (either a real or a string). This is a guaranteed send. If val contains a string the maximal string length allowed is 30000 characters.","Returns the value of the last received message.","searches for all players in the current session and returns the number of players found.","returns the unique id of player number numb (0 is the first player, which is always yourself). This routine can only be called after calling the first routine. This id is used in sending and receiving messages to and from individual players.","returns the name of player number numb (0 is the first player, which is always yourself). This routine can only be called after calling the previous routine.","creates a new session on the current connection. sesname is a string indicating the name of the session. playnumb is a number that indicates the maximal number of players allowed in this game (use 0 for an arbitrary number). playname is your name as player. Returns whether successful.","ends the session for this player.","searches for all sessions that still accept players and returns the number of sessions found.","makes you join session number numb (0 is the first session). playername is your name as a player. Returns whether successful.","sets whether or not to move the session host to another computer when the host ends. move should either be true or false (the default).","returns the name of session number numb (0 is the first session). This routine can only be called after calling the previous routine.","returns the status of the current session. 0 = no session, 1 = created session, 2 = joined session.","Adds a new object. It returns the index of the object. You can now use this index in the routines above to set certain properties of the object and then you can use the index to create instances of the object.","Deletes the object with the given index. Make sure no instances of the object exist in any of the rooms.","To give the object a behavior we must define events for the object. You can only add code actions to events. You need to specify the object, the event type, the event number (use the constants that have been specified before for the event_perform() function). Finally you provide the code string that must be executed. You can add multiple code actions to each event.","You can use this function to clear all the actions for a particular event.","Returns whether an object with the given index exists.","Returns the depth of the object with the given index.","Returns the index of the mask of the object with the given index (-1 if is has no special mask).","Returns the name of the object with the given index.","Returns index of the parent object of object ind (a negative value is returned if it has no parent).","Returns whether the object with the given index is persistent.","Returns whether the object with the given index is default solid.","Returns the index of the default sprite of the object with the given index.","Returns whether the object with the given index is default visible.","Sets the default depth of instances created of the object.","Sets the sprite mask of the object with the given index. Use -1 to set the mask to be the sprite of the object.","Sets the parent of the object. Use -1 to not have a parent. Changing the parent changes the behavior of instances of the object.","Sets whether instances created of the object must default be persistent (true or false).","Sets whether instances created of the object must default be solid (true or false).","Sets the sprite of the object with the given index. Use -1 to remove the current sprite from the object.","Sets whether instances created of the object must default be visible (true or false).","Returns the asci code of the first character in str.","Returns the number of command-line parameters. The actual parameters can be retrieved with the following function.","Returns command-line parameters n. The first parameter has index 1. The last one has index parameter_count(). Index 0 is a special one. It is the filename of the game executable (including the path).","Clears the attractor ind to its default settings.","Creates a new attractor in the given particle system. It returns the index of the attractor. This index must be used in all calls below to set the properties of the attractor.","Destroys attractor ind in the particle system. Call this if you don't need it anymore to save space.","Destroys all attractors in the particle system that have been created.","Returns whether the indicated attractor exists in the particle system.","Sets the force parameters of attractor ind.","Sets the position of attractor ind to (x,y).","Clears the changer ind to its default settings.","Creates a new changer in the given particle system. It returns the index of the changer. This index must be used in all calls below to set the properties of the changer.","Destroys changer ind in the particle system. Call this if you don't need it anymore to save space.","Destroys all changers in the particle system that have been created.","Returns whether the indicated changer exists in the particle system.","Sets the region for the changer.","Clears the deflector ind to its default settings.","Creates a new deflector in the given particle system. It returns the index of the deflector. This index must be used in all calls below to set the properties of the deflector.","Destroys deflector ind in the particle system. Call this if you don't need it anymore to save space.","Destroys all deflectors in the particle system that have been created.","Returns whether the indicated deflector exists in the particle system.","Sets the kind for the deflector.","Sets the region for the deflector.","Clears the destroyer ind to its default settings.","Creates a new destroyer in the given particle system. It returns the index of the destroyer. This index must be used in all calls below to set the properties of the destroyer.","Destroys destroyer ind in the particle system. Call this if you don't need it anymore to save space.","Destroys all destroyers in the particle system that have been created.","Returns whether the indicated destroyer exists in the particle system.","Sets the region for the destroyer.","Bursts once <tt>number</tt> particles of the indicated type from the emitter.","Clears the emitter ind to its default settings.","Creates a new emitter in the given particle system. It returns the index of the emitter. This index must be used in all calls below to set the properties of the emitter.","Destroys emitter ind in the particle system. Call this if you don't need it anymore to save space.","Destroys all emitters in the particle system that have been created.","Returns whether the indicated emitter exists in the particle system.","Sets the region and distribution for the emitter.","From this moment on create <tt>number</tt> particles of the indicated type from the emitter in every step. If you indicate a number smaller than 0 in each step a particle is generated with a chance of -1/number. So for example with a value of -5 a particle is generated on average once every 5 steps.","This functions removes all particles in the system.","This functions returns the number of particles in the system.","This functions creates <tt>number</tt> particles of the indicated type at postion (x,y) in the system.","This functions creates <tt>number</tt> particles of the indicated type at postion (x,y) in the system with the indicated color. This is only useful when the particle type defines a single color (or does not define a color at all).","Indicates whether the particle system must be drawn automatically (1) or not (0). Default is 1.","Indicates whether the particle system must be updated automatically (1) or not (0). Default is 1.","Clears the particle system ind to its default settings, removing all particles and emitter and attractors in it.","Creates a new particle system. It returns the index of the system. This index must be used in all calls below to set the properties of the particle system.","Sets the depth of the particle system. This can be used to let the particles appear behind, in front of, or in between instances.","Destroys the particle system ind. Call this if you don't need it anymore to save space.","Sets the order in which the particle system draws the particles. When oldtonew is true the oldest particles are drawn first and the newer one lie on top of them (default). Otherwise the newest particles are drawn first. This can give rather different effects.","This functions draws the particles in the system. You only have to call this when drawing is not automatic. It should be called in the draw event of some object.","Returns whether the indicated particle system exists.","Sets the position where the particle system is drawn. This is normally not necessary but if you want to have particles at a position relative to a moving object, you can set the position e.g. to that object.","This functions updates the position of all particles in the system and lets the emitters create particles. You only have to call this when updating is not automatic. (Although sometimes it is also useful to call this function a couple of time to get the system going.)","Sets whether to use additive blending (1) or normal blending (0) for the particle type.","Clears the particle type ind to its default settings.","Can be used to indicate that each particle must have a fixed color but choosen from a range. You specify a range in the hue saturation and value component of the color (each between 0 and 255).","Can be used to indicate that each particle must have a fixed color but choosen from a range. You specify a range in the red, green, and blue component of the color (each between 0 and 255).","Creates a new particle type. It returns the index of the type. This index must be used in all calls below to set the properties of the particle type. So you will often store it in a global variable.","Sets the number and type of particles that must be generated when a particle of the indicated type dies. Again you can use negative numbers to create a particle with a particular chance. Note that these particles are only created when the particle dies at the end of its life, not when it dies because of a destroyer (see below).","Destroys particle type ind. Call this if you don't need it anymore to save space.","Sets the direction properties for the particle type. (Default all values are 0.) Again you specify a range of directions (in counterclockwise degrees; 0 indicated a motion to the right). For example, to let the particle move in a random direction choose 0 and 360 as values. You can specify an increase in direction for each step, and an amount of wiggling.","Returns whether the indicated particle type exists.","Sets the gravity properties for the particle type. (Default there is no gravity.) You specify the amount of gravity to be added in each step and the direction. E.g. use 270 for a downwards direction.","Sets the lifetime bounds for the particle type. (Default both are 100.)","Sets the orientation angle properties for the particle type. You specify the minimum angle, the maximum angle, the increase in each step and the amount of wiggling in angle. (Default all values are 0.) You can also indicate whether the given angle should be relative (1) to the current direction of motion or absolute (0). E.g. by setting all values to 0 but ang_relative to 1, the particle orientation will precisely follow the path of the particle.","Sets the horizontal and vertical scale. This factor is multiplied with the size. It is in particular useful when you need to scale differently in x- and y-direction.","Sets the shape of the particle type to any of the constants above (default is pt_shape_pixel).","Sets the size parameters for the particle type. You specify the minimum starting size, the maximum starting size, the size increase in each step (use a negative number for a decrease in size) and the amount of wiggling. (The default size is 1 and default the size does not change.)","Sets the speed properties for the particle type. (Default all values are 0.) You specify a minimal and maximal speed. A random value between the given bounds is chosen when the particle is created. You can indicate a speed increase in each step Use a negative number to slow the particle down (the speed will never become smaller than 0). Finally you can indicate some amount of wiggling of the speed.","Sets your own sprite for the particle type. With animate you indicate whether the sprite should be animated (1) or not (0). With stretch (1 or 0) you indicate whether the animation must be stretched over the lifetime of the particle. And with random (1 or 0) you can indicate whether a random subimage must be choosen as starting image.","Sets the number and type of particles that must be generated in each step for the indicated particle type. If you use a negative value, in each step a particle is generated with a chance -1/number. So for example with a value of -5 a particle is generated on average once every 5 steps.","Adds a new empty paths. The index of the path is returned.","Adds a point to the path with the given index, at position (x,y) and with the given speed factor. Remember that a factor of 100 corresponds to the actual speed. Lower values mean slowing down and higher mean speeding up.","Appends the indicated path to path ind.","Assigns the indicated path to path ind. So this makes a copy of the path. In this way you can easily set an existing path to a different, e.g. new path.","Changes the point n in the path with the given index to position (x,y) and the given speed factor.","Clears all the points in the path, turning it into an empty path.","Deletes the path with the given index.","Deletes the point n in the path with the given index.","Creates a duplicate copy of the path with the given index. Returns the index of the copy.","Ends the following of a path for the current instance.","Returns whether a path with the given index exists.","Flips the path vertically (with respect to its center).","Returns whether the path is closed or not.","Returns the kind of connections of the path with the given index (0=straight, 1=smooth).","Returns the length of the path with the given index.","Returns the name of the path with the given index.","Returns the number of defining points for the path.","Returns the speed factor at the n'th defining point for the path. 0 is the first point.","Returns the x-coordinate of the n'th defining point for the path. 0 is the first point.","Returns the y-coordinate of the n'th defining point for the path. 0 is the first point.","Returns the precision used for creating smoothed paths.","Returns the speed factor at position pos for the path. pos must lie between 0 and 1.","Returns the x-coordinate at position pos for the path. pos must lie between 0 and 1.","Returns the y-coordinate at position pos for the path. pos must lie between 0 and 1.","Inserts a point in the path with the given index before point n, at position (x,y) and with the given speed factor.","Mirrors the path horizontally (with respect to its center).","Reverses the path.","Rotates the path counter clockwise over angle degrees (around its center).","Scales the path with the given factors (from its center).","Sets whether the path must be closed (true) or open (false).","Sets the kind of connections of the path with the given index (0=straight, 1=smooth).","Sets the precision with which the smooth path is calculated (should lie between 1 and 8).","Shifts the path over the given amount.","<tt><tt>Starts a path for the current instance. The <TT>path</TT> is the name of the path you want to start. The <TT>speed</TT> is the speed with which the path must be followed. A negative speed means that the instance moves backwards along the path. The <TT>endaction</TT> indicates what should happen when the end of the path is reached. The following values can be used:</tt> <p> <blockquote> 0 :</tt> stop the path","Returns whether the instance placed at position (x,y) meets nobody. So this function takes also non-solid instances into account.","Returns whether the instance placed at position(x,y) is collision-free. This is typically used as a check before actually moving to the new position.","Returns whether the instance placed at position (x,y) meets obj. obj can be an object in which case the function returns true is some instance of that object is met. It can also be an instance id, the special word all meaning an instance of any object, or the special word other.","Returns whether the instance is aligned with the snapping values.","Changes all instances at (x,y) into obj. perf indicates whether to perform the destroy and creation events.","Destroys all instances whose sprite contains position (x,y).","Returns whether there is nothing at position (x,y).","Returns whether at position (x,y) there is an instance obj. obj can be an object, an instance id, or the keywords <tt>self</tt>, <tt>other</tt>, or <tt>all</tt>.","Returns x to the power n.","Converts radians to degrees.","Returns a random real number between 0 and x. The number is always smaller than x.","Returns the current seed.","Sets the seed (an integer) that is used for the random number generation. Can be used to repeat the same random sequence. (Note though that also some actions and the system itself uses random numbers.)","Sets the seed to a random number.","Turns str into a real number. str can contain a minus sign, a decimal dot and even an exponential part.","<tt>Returns whether the given name exists. </blockquote> <p> Actually, values in the registry are grouped into keys. The above routines all work on values within the key that is especially created for your game. Your program can use this to obtain certain information about the system the game is running on. You can also read values in other keys. You can write them also but be very careful. YOU CAN EASILY DESTROY YOUR SYSTEM this way. (Write is not allowed in secure mode.) Note that keys are again placed in groups. The following routines default work on the group HKEY_CURRENT_USER. But you can change the root group. So, for example, if you want to find out the current temp dir, use <p> <blockquote> <pre> path = registry_read_string_ext('\Environment','TEMP'); </pre> </blockquote> <p> The following functions exist:</tt> <p> <blockquote> <tt><b>registry_write_string_ext(key,name,str)</b></tt> Creates an entry in the key in the registry with the given name and string value.","Returns whether the given name exists in the given key.","Returns the real value that the given name holds. (The name must exist. Otherwise the number 0 is returned.)","Returns the real value that the given name in the indicated key holds. (The name must exist. Otherwise the number 0 is returned.)","Returns the string that the given name holds. (The name must exist. Otherwise an empty string is returned.)","Returns the string that the given name in the indicated key holds. (The name must exist. Otherwise an empty string is returned.)","Sets the root for the other routines. Use the following values:","Creates an entry in the registry with the given name and real value.","Creates an entry in the key in the registry with the given name and real value.","Creates an entry in the registry with the given name and string value.","Adds a new room. It returns the index of the room. Note that the room will not be part of the room order. So the new room does not have a previous or a next room. If you want to move to an added room you must provide the index of the room.","Assigns the indicated room to room ind. So this makes a copy of the room.","Adds a copy of the room with the given index. It returns the index of the room.","Returns whether a room with the given index exists.","Returns the name of the room with the given index.","Goto the room with index numb.","Go to the next room.","Go to the previous room.","Adds a new instance of object obj to the room, placing it at the indicate position. It returns the index of the instance.","Removes all instances from the indicated room.","Return the index of the room after numb (-1 = none).","Return the index of the room before numb (-1 = none) but don't go there.","Restart the current room.","Sets background with index bind (0-7) for the room with the indicated index. vis indicates whether the background is visible and fore whether it is actually a foreground. back is the index of the background image. x,y indicate the position of the image and htiled and vtiled indicate whether the image must be tiled. hspeed and vspeed indicate the speed with which the background moves and alpha indicates an alpha translucency value (1 = solid and fastest).","Sets the color properties for the room with the indicated index if is does not have a background image. col indicates the color and show indicates whether the color must be shown or not.","Sets the caption for the room with the indicated index.","Sets the initialization code string for the room with the indicated index.","Sets the height for the room with the indicated index.","Sets whether the room with the indicated index is persistent or not.","Sets the view with index vind (0-7) for the room with the indicated index. vis indicates whether the view is visible. xview, yview, wview, and hview indicate the position of the view in the room. xport, yport, wport, and hport indicate the position on the screen. When the view must follow an object hborder and vborder indicate the minimal visible border that must be kept around the object. hspeed and vspeed indicate the maximal speed with which the view can move. obj is the index of the object or the index of the instance.","Sets whether views must be enabled for the room with the indicated index.","Sets the width for the room with the indicated index.","Adds a new tile to the room at the indicate position. It returns the index of the tile. back is the background from which the tile is taken. left, top, width and height indicate the part of the background that forms the tile. x,y is the position of the tile in the room and depth is the depth of the tile.","Same as the previous routine but this time you can also specify a scaling factor in x and y direction and an alpha transparency for the tile.","Removes all tiles from the indicated room.","Returns x rounded to the nearest integer.","Redraws the room by calling all draw events.","Refreshes the screen using the current room image (not performing drawing events).","Saves a png image of the screen in the given filename. Useful for making screenshots.","Saves part of the screen in the given png filename.","Waits for the next vertical synchronization of the monitor.","Returns whether a script with the given index exists.","Returns the name of the script with the given index.","Returns the text string of the script with the given index.","Sets the title of the application to the given string. The title is for example shown in the task bar.","Indicates whether to automatically redraw the room (true, default) or not (false).","Sets the priority for the program. You can indicate a value between -3 and +3. A value of -3 means that the program will only run if no other process on the computer requires processing time, or stated differently, when all other processes are idle. Values of -2 and -1 are below normal, so other processes will get priority. 0 is the normal value. +1 and +2 give a higher priority, resulting possibly in higher speed and smoother game flow. But other processes will get much less processing time. +3 indicates real-time mode. In real-time mode basically all time is allotted to the game. This can lead to serious problems with any other applications running on the computer. Also keyboard events and e.g. the pressing of the close box might no longer be recorded by Windows. So only use this if you want all the processor time. Also better check carefully before using it and save the game before running.","Indicates whether to synchronize the drawing with the refresh frequency of the monitor.","Shows the string in debug mode.","Displays a standard error message (and/or writes it to the log file). abort indicates whether the game should abort.","Displays the game information window.","Shows a popup menu. str indicates the menu text. This consists of the different menu items with a vertical bar between them. For example, str = 'menu0|menu1|menu2'. When the first item is selected a 0 is returned, etc. When the player selects no item, the default value def is returned.","Shows a popup menu as in the previous function but at position x,y on the screen.","Displays a dialog box with the string as a message.","Displays a question; returns true when the user selects yes and false otherwise.","Returns the sign of x (-1, 0 or 1).","Returns the sine of x (x in radians).","Sleeps numb milliseconds.","Adds a sound resource to the game. fname is the name of the sound file. kind indicates the kind of sound (0=normal, 1=background, 2=3d, 3=mmplayer) preload indicates whether the sound should immediately be stored in audio memory (true or false). The function returns the index of the new sound, which can be used to play the sound. (-1 if an error occurred, e.g. the file does not exist).","Changes the tempo of the background music (if it is a midi file). <tt>factor</tt> indicates the factor with which to multiply the tempo. So a value of 1 corresponds to the normal tempo. Larger values correspond to a faster tempo, smaller values to a slower tempo. Must lie between 0.01 and 100.","Deletes the indicated sound, freeing all memory associated with it. It can no longer be restored.","<tt><tt>Sets the parameters for the chorus effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>wetdry</tt> Ratio of wet (processed) signal to dry (unprocessed) signal. (range:</tt> 0 to 100, default 50)","<tt><tt>Sets the parameters for the compressor effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>gain</tt> Output gain of signal after compression. (range:</tt> -60 to 60, default 0)","<tt><tt>Sets the parameters for the echo effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>wetdry</tt> Ratio of wet (processed) signal to dry (unprocessed) signal. (range:</tt> 0 to 100, default 50)","<tt><tt>Sets the parameters for the equalizer effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>center</tt> Center frequency, in hertz. (range:</tt> 80 to 16000)","<tt><tt>Sets the parameters for the flanger effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>wetdry</tt> Ratio of wet (processed) signal to dry (unprocessed) signal. (range:</tt> 0 to 100, default 50)","<tt><tt>Sets the parameters for the gargle effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>rate</tt> Rate of modulation, in Hertz. (range:</tt> 1 to 1000, default 1)","<tt><tt>Sets the parameters for the reverb effect for the indicated sound. The following parameters can be set:</tt> <blockquote> <tt>gain</tt> Input gain of signal, in decibels (dB). (range:</tt> -96 to 0, default 0)","<tt>Sets a (combination of) sound effect(s) for the indicated sound. <tt>effect</tt> can be any of the following values:</tt> <blockquote> <tt><b>se_none</b></tt>","Returns whether a sound with the given index exists.","Changes the volume for the indicated sound to the new value(0 = low, 1 = high) during the indicated time (in milliseconds). This can be used to fade out or fade in music.","Returns the kind of the sound with the given index (0=normal, 1=background, 2=3d, 3=mmplayer).","Returns the name of the sound with the given index.","Returns whether the sound with the given index has preload set. </blockquote> <p> Sounds use many resources and most systems can store and play only a limited number of sounds. If you make a large game you would like to have more control over which sounds are loaded in audio memory at what times. You can use the switch off the preload option for sounds to make sure sounds are only loaded when used. This though has the problem that you might get a small hiccup when the sound is used first. Also, sounds are not automatically unloaded when you don't need them anymore. For more control you can use the following functions. <p> <blockquote> <tt><b>sound_discard(index)</b></tt> Frees the audio memory used for the indicated sound.","Changes the global volume for all sounds (0 = low, 1 = high).","Returns whether (a copy of) the indicated sound is playing. Note that this functions returns true when the sound actually plays through the speakers. After you call the function to play a sound it does not immediately reach the speakers so the function might still return false for a while. Similar, when the sound is stopped you still hear it for a while (e.g. because of echo) and the function will still return true.","Plays the indicates sound, looping continuously. If the sound is background music the current background music is stopped.","Changes the pan for the indicated sound (-1 = left, 0 = center, 1 = right).","Plays the indicates sound once. If the sound is background music the current background music is stopped.","Same as the previous function but this time a new sound is not created but the existing sound index is replaced, freeing the old sound. Returns whether correct.","Restores the indicated sound in audio memory for immediate playing.","Sets the directory in which direct music files are to be found. The dir string should not incluce the final backslash.","Stops the indicates sound. If there are multiple sounds with this index playing simultaneously, all will be stopped.","Stops all sounds.","Changes the volume for the indicated sound (0 = low, 1 = high).","Indicated whether the size of the window must be adapted to the scaled size of the video or image. This only has effect when is a separate splash window is used. Default adapt is true.","Indicates whether the window should have a border. This only has effect when is a separate normal splash window is used. Default a border is used.","Sets the caption for the splash window. This only has effect when is a separate splash window is used. Default the empty string is used.","Indicates whether to show a close button in the top right corner of the splash screen. This is useful when running games in full screen mode or without a border. Default the value is true.","Sets the color of the area surrounding the image or video.","Sets whether the cursor should be visible in the splash screen. Default it is visible. For movies the cursor cannot be switched off.","Indicates whether to use a full screen window or not. This only has effect when is a separate splash window is used. Default a normal window is used.","Indicates whether the game play should be interrupted while showing the splash window. This only has effect when is a separate splash window is used. Default the value is true.","Indicated whether the splash screen must be shown in the main game window (true, default) or in a separate window (false).","Sets the position of the splash window. This only has effect when is a separate normal splash window is used. Default Windows determines the position.","Sets the scale factor to be used when displaying a splash video or image. When using a value of 0 the scale factor is chosen such that the window is filled (default).","Sets the size of the splash window. This only has effect when is a separate normal splash window is used. Default size is 640x480.","Indicates whether to stop the display of the splash screen when the player pressed the Escape key. Default the value is true.","Indicates whether to stop the display of the splash screen when the player pressed the mouse inside the splash screen. Default the value is true.","Indicates whether the window should stay on top of other windows. This only has effect when is a separate splash window is used. Default the value is true.","Shows an image splash screen. fname is the name of the image file. Many image types are supported (for example .bmp, .jpg, .tif, and .wmf) but no animated images. delay is the delay in milli seconds before returning to the game.","Shows a text splash screen. fname is the name of the text file. You can either display standard text files (.txt) or rich text files (.rtf). Only part of the rich text features are taken into account. E.g. images and other embedded objects are not shown. delay indicates the delay in milliseconds before returning to the game. use 0 or a negative value to wait until the player presses the escape key or clicks with the mouse in the window. (Note that no scrollbar will be shown nor is there another way to scroll the text. So the text must fit the window.)","Shows a video splash screen. fname is the name of the video file. Whether a particular movie file is supported depends on the drivers on the machine. Typically you can use .avi, .mpg, and .wmv files but avoid special codecs. You best put this file in the folder of the game yourself or in a subfolder. loop indicates whether to loop the video.","Shows a web page splash screen. url is the url of the webpage (starting with <tt>http://</tt>) or it is the file name for a local html file. Note however that you must provide the full path for this to work. So you best e.g. use as url something like <tt>working_directory + \"\index.html\"</tt>. delay is the delay in milli seconds before returning to the game.","Adds the image stored in the file fname to the set of sprite resources. Many different image file types can be dealt with. When the image is not a gif image it can be a strip containing a number of subimages for the sprite next to each other. Use imgnumb to indicate their number (1 for a single image). For gif images, this argument is not used; the number of images in the gif file is used instead. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the edges. <tt>xorig</tt> and <tt>yorig</tt> indicate the position of the origin in the sprite. The function returns the index of the new sprite that you can then use to draw it or to assign it to the variable sprite_index of an instance. When an error occurs -1 is returned.","Adds an area of the screen as a next subimage to the sprite with index ind.","Adds an area of the surface id as a next subimage to the sprite with index ind.","Adds the sprite stored the file fname to the set of sprite resources. The file must be a .gmspr file that is saved in the sprite property form in <i>Game Maker</i>. As this file contains all sprite settings, no further arguments are required. The function returns the index of the new sprite that you can then use to draw it or to assign it to the variable sprite_index of an instance. When an error occurs -1 is returned.","Assigns the indicated sprite to sprite ind. So this makes a copy of the sprite. In this way you can easily set an existing sprite to a different, e.g. new sprite.","Changes the collision mask for the sprite with index <tt>ind</tt>. <tt>sepmasks</tt> indicates whether there must be separate collision masks for all subimages. <tt>bboxmode</tt> is the bounding box mode (0=automatic, 1=full image, 2=user defined). <tt>bbleft, bbright, bbtop, bbbottom</tt> indicate the bounding box in case of user defined bounding box. You can use 0 for all these values in the other cases. <tt>kind</tt> is the kind of mask (0=precise, 1=bounding box, 2=disk, 3=diamond). <tt>tolerance</tt> indicates the tolerance in the transparency value (0=no tolerance, 255=full tolerance).","Creates a sprite by copying the given area from the screen. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the boundaries. This makes it possible to create any sprite you want. Draw the image on the screen using the drawing functions and next create a sprite from it. (If you don't do this in the drawing event you can even do it in such a way that it is not visible on the screen by not refreshing the screen.) The other parameters are as above. The function returns the index of the new sprite. A work of caution is required here. Even though we speak about the screen, it is actually the drawing region that matters. The fact that there is a window on the screen and that the image might be scaled in this window does not matter.","Creates a sprite by copying the given area from the surface with the given id. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the boundaries. This makes it possible to create any sprite you want. Draw the image on the surface using the drawing functions and next create a sprite from it. The function returns the index of the new sprite. Note that alpha values are maintained in the sprite.","Deletes the sprite from memory, freeing the memory used.","Creates a duplicate of the sprite with the given index. It returns the index of the new sprite. When an error occurs -1 is returned.","Returns whether a sprite with the given index exists.","Returns the bottom side of the bounding box of the sprite with the given index.","Returns the left side of the bounding box of the sprite with the given index.","Returns the right side of the bounding box of the sprite with the given index.","Returns the top side of the bounding box of the sprite with the given index.","Returns the height of the sprite with the given index.","Returns the name of the sprite with the given index.","Returns the number of subimages of the sprite with the given index.","Returns the id of the texture corresponding to subimage subimg of the indicated sprite.","Returns the width of the sprite with the given index.","Returns the x-offset of the sprite with the given index.","Returns the y-offset of the sprite with the given index.","Same as above but in this case the sprite with index ind is replaced. The function returns whether it is successful.","Same as above but in this case the sprite with index ind is replaced. The function returns whether it is successful.","Saves subimage subimg of sprite ind to the file with the name fname. This must be a .png file. <b><i>Only available in the Standard Edition.</i></b>","Saves all subimages of sprite ind as a strip to the file with the name fname. This must be a .png file. <b><i>Only available in the Standard Edition.</i></b>","Changes the alpha (transparancy) values in the sprite with index <tt>ind</tt> using the intensity values in the sprite <tt>spr</tt>. This cannot be undone.","Sets the offset of the sprite with the given index.","Returns x*x.","Returns the square root of x. x must be non-negative.","Turns the real value into a string using a standard format (no decimal places when it is an integer, and two decimal places otherwise).","Returns the raw byte value as a REAL at BYTE position <i>index.</i>","Returns the number of BYTES in the string. As strings are now held as UTF8, this means the length of the string is no longer it's BYTE size.","Returns the character in str at position index.","Returns a substring of str, starting at position index, and of length count.","Returns the number of occurrences of substr in str.","Returns a copy of str with the part removed that starts at position index and has length count.","Returns a string that only contains the digits in str.","<tt>Turns val into a string using your own format:</tt> tot indicates the total number of places and dec indicates the number of decimal places.","Height of the string in the current font as it would be drawn using the <tt>draw_text()</tt> function.","Height of the string in the current font as it would be drawn using the <tt>draw_text_ext()</tt> function.","Returns a copy of str with substr added at position index.","Returns the number of characters in the string.","Returns a string that only contains the letters in str.","Returns a string that contains the letters and digits in str.","Returns a lowercase copy of str.","Returns the position of substr in str (0=no occurrence).","Returns a string consisting of count copies of str.","Returns a copy of str with the first occurrence of substr replaced by newstr.","Returns a copy of str with all occurrences of substr replaced by newstr.","Returns an uppercase copy of str.","Width of the string in the current font as it would be drawn using the <tt>draw_text()</tt> function. Can be used for precisely positioning graphics.","Width of the string in the current font as it would be drawn using the <tt>draw_text_ext()</tt> function. Can be used for precisely positioning graphics.","Copies the source surface at position (x,y) in the destination surface. (Without any form of blending.)","Copies the indicated part of the source surface at position (x,y) in the destination surface. (Without any form of blending.)","Creates a surface of the indicated width and height. Returns the id of the surface, which must be used in all further calls. Note that the surface will not be cleared. This is the responsibility of the user. (Set it as a target and call the appropriate clear function.)","Returns whether the surface with the indicated id exists.","Frees the memory used by the surface.","Returns the height of the surface.","Returns the texture corresponding to the surface. This can be used to draw textured objects with the image of the surface.","Returns the width of the surface.","Returns the color of the pixel corresponding to position (x,y) in the surface. This is not very fast, so use with care.","Resets the drawing target to the normal screen.","Saves a png image of the surface in the given filename. Useful for making screenshots.","Saves part of the surface in the given png filename.","Sets the indicated surface as the drawing target. All subsequent drawing happens on this surface. It resets the projection to simply cover the surface.","Returns the tangent of x (x in radians).","Returns the height of the texture with the given id. The height lies in the range 0-1.","Returns the width of the texture with the given id. The width lies in the range 0-1.","Puts the texture immediately into video memory.","Indicates whether to use blending with colors and alpha values. Switching this off might be faster on old hardware. This setting also influence the drawing of sprites and background. Default is true.","Indicates whether to use linear interpolation (true) or pick the nearest pixel (false). Linear interpolation gives smoother textures but can also be a bit blurry and sometimes costs extra time. This setting also influence the drawing of sprites and background. Default is false. (This can also be changed in the global game settings.)","When there is too little video memory some will be removed temporarily to make room for others that are needed. The ones with lowest priority are removed first. Default, all have priority 0 but you can change the priority here. (Use positive values!)","Indicates whether to use repeat the texture. This works as follows. As indicated above texture coordinates lie in the range 0-1. If you specify a value larger than 1, default the rest is not drawn. By setting repeat to true the texture is repeated. Note that sprites and backgrounds are always drawn without repeating. So once you draw a sprite of background this value is reset to false. Default is false.","Adds a new tile to the room with the indicated values (see above for their meaning). The function returns the id of the tile that can be used later on.","Deletes the tile with the given id.","Returns whether a tile with the given id exists.","Returns the alpha value of the tile with the given id.","Returns the background of the tile with the given id.","Returns the blending color of the tile with the given id.","Returns the depth of the tile with the given id.","Returns the height of the tile with the given id.","Returns the left value of the tile with the given id.","Returns the top value of the tile with the given id.","Returns whether the tile with the given id is visible.","Returns the width of the tile with the given id.","Returns the x-position of the tile with the given id.","Returns the xscale of the tile with the given id.","Returns the y-position of the tile with the given id.","Returns the yscale of the tile with the given id.","Deletes all tiles at the indicated depth layer.","Deletes the tile with the given depth at position (x,y). When multiple tiles with the given depth exist at the position they are all deleted.","Changes the depth of all tiles at the indicated depth to the new depth. With this function you can move whole tile layers to a new depth.","Returns the id of the tile with the given depth at position (x,y). When no tile exists at the position -1 is returned. When multiple tiles with the given depth exist at the position the first one is returned.","Hides all tiles at the indicated depth layer.","Shifts all tiles at the indicated depth layer over the vector x,y. Can be used to create scrolling layers of tiles.","Shows all tiles at the indicated depth layer.","Sets the alpha value of the tile with the given id.","Sets the background for the tile with the given id.","Sets the blending color of the tile with the given id. <b><i>Only available in the Standard Edition!</i></b>","Sets the depth of the tile with the given id.","Sets the position of the tile with the given id.","Sets the region of the tile with the given id in its background.","Sets the scaling of the tile with the given id.","Sets whether the tile with the given id is visible.","Adds a new time line. It returns the index of the time line.","Clears the time line with the given index removing all its moments. Make sure no instances uses the time line at the moment.","Deletes the time line with the given index. Make sure no instances uses the time line in any room.","Returns whether a time line with the given index exists.","Returns the name of the time line with the given index.","Adds a code action to the time line at moment step. codestr contains the code for the actions. If the step does not exist it is created. So you can add multiple code actions for the same moment.","You can use this function to clear all the actions for a particular moment.","<tt>You can actually create your own transitions. To this end you must define a script (possibly in an extension package) to do the transition. With this function you can then add the transition to the system. <tt>kind</tt> is the index of the transition (either a new one or an existing transitions). <tt>name</tt> is the name of the script. Note that the name of the script is a string! So there must be quotes around it. Note that this is really advanced stuff. The script must take five arguments:</tt> a surface with the image of the previous room, a surface with the image of the next room, the width of the surfaces, the height of the surfaces, and the fraction of the transition (between 0 and 1). It must then draw the image using the two surfaces.","Returns the value of index ind of the global array variable with the given name (a string).","Sets the index ind in the global array variable with the given name (a string) to the given value.","Returns whether a global variable with the given name (a string) exists.","Returns the value of the global variable with the given name (a string).","Sets the global variable with the given name (a string) to the given value.","Returns the value of index ind of the local array variable with the given name (a string).","Sets the index ind in the local array variable with the given name (a string) to the given value.","Returns whether a local variable with the given name (a string) exists for the current instance.","Returns the value of the local variable with the given name (a string).","Sets the local variable with the given name (a string) to the given value.","Centers the window on the screen.","Gives the window the default size and position (centered) on the screen.","Returns the window caption.","Returns the window color.","Returns the cursor used in the window.","Returns whether the window is shown in full screen mode.","Returns the current height of the window.","Returns the current height of the drawing region.","Returns the scale factor for the drawing region.","Returns the current width of the drawing region.","Returns whether the border around the window is shown in windowed mode.","Returns whether the border icons are shown in windowed mode.","Returns whether the window is sizeable by the player.","Returns whether the window always stays on top of other windows.","Returns whether the game window is visible.","Returns the current width of the window.","Returns the current x-coordinate of the window.","Returns the current y-coordinate of the window.","Returns the window handle for the main window.","Returns the x-coordinate of the mouse in the window.","Returns the y-coordinate of the mouse in the window.","Sets the position of the mouse in the window to the indicated values.","Sets the caption string for the window. Normally you specify this when defining the room and it can be changed using the variable room_caption. So this function is normally not useful, unless you draw the room yourself rather than letting <i>Game Maker</i> do it. The caption is only visible when the window has a border and when it is not in full screen mode.","Sets the color of the part of the window that is not used for displaying the room.","<tt>Sets the mouse cursor used in the window. You can use the following constant:</tt> <p> <blockquote> <tt><b>cr_default</b></tt>","Sets whether the window is shown in full screen mode.","Sets the position of the (client part of the) window to the indicated position.","Sets the position and size of the window rectangle. (Does both previous routines in one step.)","If the window is larger than the actual room normally the room is displayed in a region centered in the window. It is though possible to indicate that it must be scaled to fill the whole or part of the window. A value of 1 is no scaling. If you use a value of 0 the region will be scaled to fill the whole window. If you set it to a negative value it will be scaled to the maximal size inside the window while maintaining the aspect ratio (this is often what you want). <tt>adaptwindow</tt> indicates whether the window size must be adapted if the scaled room does not fit in. Adapting the window is only effective when the scale factor is positive.","Set the width and height of the drawing region in the window. <tt>adaptwindow</tt> indicates whether the window size must be adapted if the region does not fit in. The window size will always be adapted if you use fixed scaling. (See the function <tt>window_set_region_scale()</tt>.)","Sets whether the border around the window is shown. (In full screen mode it is never shown.)","Sets whether the border icons (iconize, maximize, close) are shown. (In full screen mode these are never shown.)","Sets the size of the (client part of the) window to the indicated size. Note that is the indicated size is too small to fit the drawing region it is kept large enough for the region to fit it.","Sets whether the window is sizeable by the player. (The player can only size it when the border is shown and the window is not in full screen mode.)","Sets whether the window must always stay on top of other windows.","Sets whether the game window is visible. Clearly you normally want the window to remain visible during the whole game. The program will not receive keyboard events when the window is invisible.","Returns the x-coordinate of the mouse with respect to the view with index id.","Returns the y-coordinate of the mouse with respect to the view with index id.","Sets the position of the mouse with respect to the view with index id.","Returns the x-coordinate of the mouse with respect to the view it is in (same as <tt>mouse_x</tt>).","Returns the y-coordinate of the mouse with respect to the view it is in (same as <tt>mouse_y</tt>)."],["<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> The number of axes of the joystick.","<tt>id:</tt> joystick (0-31)<br><tt>axis:</tt> axis number (0-16)<br><tt>Returns:</tt> the position (-1 to 1) of the joystick's axis.<br><br>The currently set global deadzone is taken into account.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> The number of buttons of the joystick.","<tt>id:</tt> joystick (0-31)<br><tt>numb:</tt> button number (0-255)<br><tt>Returns:</tt> whether the joystick button is pressed.","<tt>id:</tt> joystick (0-31)<br><tt>numb:</tt> button number (0-255)<br><tt>Returns:</tt> whether the joystick button was pressed since the last frame.","<tt>id:</tt> joystick (0-31)<br><tt>numb:</tt> button number (0-255)<br><tt>Returns:</tt> whether the joystick button was released since the last frame.","<tt>Returns:</tt> the number of joysticks currently connected and available.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> the keycode (vk_numpad1 to vk_numpad9) corresponding to the direction of joystick id.<br><br>Compatibility GM8 function. For more advanced functionality, try joystick_direction_leftstick(id).","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> Angle of the joystick's left stick, or -1 if no direction is pressed.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> Angle of the joystick's right stick, or -1 if no direction is pressed.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> Analog distance of the joystick's left stick.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> Analog distance of the joystick's right stick.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> whether joystick id (0-31) exists.<br><br>Use joystick_count() to know how many joysticks are connected.","<tt>Returns:</tt> true if the known joysticks have changed since last step (either when new ones are found or old ones lost).","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> whether the joystick has a pov hat or d-pad.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> The device name reported by the joystick.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> The joysticks point-of view position. This is an angle between 0 and 360 degrees. 0 is forwards, 90 to the right, 180 backwards and 270 to the left. When no point-of-view direction is pressed by the user -1 is returned.<br><br>Compatibility GM8 function. For more advanced usage, try joystick_pov_direction(id).","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> A standard game maker angle for the pov hat (d-pad), or -1 if no direction is pressed.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> an axis value (-1, 0 or 1) for the pov hat (d-pad) horizontal.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> an axis value (-1, 0 or 1) for the pov hat (d-pad) vertical.","<tt>id:</tt> joystick (0-31)<br><tt>Returns:</tt> the position (-1 to 1) of the joystick's r axis.<br><br>The currently set global deadzone is taken into account.","<tt>id:</tt> joystick (0-31)<br><tt>strength:</tt> rumble strength (0-100, 0 to stop rumble)<br><tt>len:</tt> length of rumble, in milliseconds<br><tt>Returns:</tt> 1 if rumble is supported by controller, otherwise 0.","<tt>value:</tt> amount of deadzone (0-1)<br><br>Sets the deadzone for all joystick checks. You can set this imme     //initialize some values
    func_names = [];
    func_descs = [];
    current_query = "";
    var searchfield = document.getElementById("search");
    var functionlist = document.getElementById("function");
    
    //fill extension list
    var list = document.getElementById("extension");    
    for (i=0; i<func_exts.length; i+=1) {
        opt = document.createElement("option");
        opt.innerHTML = func_exts[i];
        list.appendChild(opt);
    }
    
    //change currently displayed extension
    function change_ext() {
        var select = document.getElementById("extension");
        var ext = select.selectedIndex;
        
        func_names = func_name_table[ext];
        func_descs = func_desc_table[ext]; 

        //fill function list
        functionlist.innerHTML = "";
        for (i=0; i<func_names.length; i+=1) {
            opt = document.createElement("option");
            opt.innerHTML = func_names[i];
            functionlist.appendChild(opt);
        }
        
        //clear it out
        searchfield.value = "";
        document.getElementById("func name").innerHTML = "";
        document.getElementById("func desc").innerHTML = "";
    }
    
    //change currently displayed function
    function change_func() {
        var select = document.getElementById("function");
        var value = select.options[select.selectedIndex].text;
        
        //display function contents
        document.getElementById("func name").innerHTML = func_names[select.selectedIndex];
        document.getElementById("func desc").innerHTML = func_descs[select.selectedIndex];
    }
    
    //search box updated
    function search() {
        var query = searchfield.value;
        if (query != current_query && query != "") {
            //perform search, with scoring based on leftmostness of query string
            current_query = query;
            var best_match = 999;
            var id_match = -1;
            for (i=0; i<func_names.length; i+=1) {
                var match = func_names[i].indexOf(query);
                if (match != -1 && match < best_match) {
                    best_match = match;
                    id_match = i;
                }
            }
            if (id_match!=-1) {
                //select function in list box
                functionlist.value = functionlist.options[id_match].text;
                functionlist.selectedIndex = id_match;
                change_func();
            } else {
                functionlist.selectedIndex = -1;
                document.getElementById("func name").innerHTML = "Search empty";
                document.getElementById("func desc").innerHTML = "No results found for \""+query+"\".";
            }
        }
    }
    
    setInterval(search,100);
