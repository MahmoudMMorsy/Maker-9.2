    func_desc_table=[
        ["<tt>enable:</tt> enable alpha blending<br><br>Allows the game to draw directly to the alpha channel of the aero window.<br>Requires the Desktop Window Manager (DWM) to be enabled.","<tt>enable:</tt> enable chroma key mode<br><tt>color:</tt> color to chroma key<br>Enables experimental chroma key mode.<br><tt>Note:</tt> does not work in Windows 7 at the moment."],["Pauses execution of the audio engine.","Resumes execution of the audio engine.","Stops all sound.","<tt>volume:</tt> gain value<br><br>Sets the global volume for the audio engine.","<tt>inst:</tt> sound instance to apply the model to<br><tt>vol, pitch:</tt> default volume and pitch of the sound source<br><tt>x, y, z:</tt> position of the sound source relative to the listener<br><tt>h, v, zspeed:</tt> speed of the sound source<br><tt>min, maxdist:</tt> distances when to start and end fading the volume<br><tt>listener_direction:</tt> angle the listener is facing<br><tt>falloff_model:</tt> falloff_ constant defining the fall off slope to use<br><tt>volume_model:</tt> volume_ constant defining which volume model to use<br><tt>falloff_exp:</tt> default. volume decreases the same way it would in real-life<br><tt>falloff_invexp:</tt> inverse of exponential, the sound is mostly fully audible until close to the max distance<br><tt>falloff_linear:</tt> a middle term between the other two models<br><tt>volume_front:</tt> default. volume is quieter behind the listener. models hearing loss based on ear and head geometry<br><tt>volume_omni:</tt> volume is the same in front and behind the listener<br><br>Applies a 3D audio model to a sound instance.<br>The instance's volume, pitch and pan values are modified.<br>Call every step on the instance to simulate 3D sound.","<tt>sound:</tt> sound to delete<br><br>Deletes a sound. New sounds don't reuse ids.<br>If an instance of the sound is still playing, it finishes playing.","<tt>sound/inst:</tt> sound index to check, or instance<br><tt>Returns:</tt> various values<br fer index<br><br>Returns whether the buffer caret is currently at the very end of the buffer.","<tt>id:</tt> buffer index<br><br>Clears the buffer of all data and sets the caret at the start.","<tt>id:</tt> buffer index<br><br>Clears the error state of a buffer, allowing it to be used again.","<tt>to:</tt> destination buffer id<br><tt>from:</tt> source buffer id<br><br>Copies the data in the source buffer to the end of the destination buffer.","<tt>to:</tt> destination buffer id<br><tt>from:</tt> source buffer id<br><tt>pos/len:</tt> part of the source buffer to copy<br><br>Copies the part of the data in the source buffer to the end of the destination buffer.","<tt>filename:</tt> optional filename to preload<br><tt>Returns:</tt> buffer id<br><br>Creates and returns a buffer index. If a filename is passed, the file is also preloaded to the buffer.<br>Note that unlike 39dll, there isn't a default buffer. You always need to explicitly create and destroy buffers.","<tt>id:</tt> buffer index<br><tt>string:</tt> base64 string to decode<br><br>This will decode the base64 data into the buffer. For example, \"Y2F0\" becomes \"cat\".","<tt>id:</tt> buffer index<br><br>Compresses a buffer using zlib.","<tt>id:</tt> buffer index<br><br>Destroys a buffer.<br>Always destroy buffers when you're done with them to free up memory.","<tt>id:</tt> buffer index<br><tt>len:</tt> length in bytes to encode<br><tt>Returns:</tt> string<br><br>This will encode the buffer into its base64 representation. For example, \"cat\" becomes \"Y2F0\".","<tt>id:</tt> buffer index<br><br>Returns whether the buffer with 'id' exists.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> address of the buffer for use with dlls<br><br>This function obtains the memory address of a buffer so that other dll extensions may write to or read from it.<br>Note that you should always preallocate the buffer appropriately using buffer_set_size before passing it on to a dll for writing.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> whether the buffer has been locked with an error<br><br>Errors are usually caused by reading out of bounds.","<tt>id:</tt> buffer index<br><br>Returns the current size of the buffer in bytes.","<tt>id:</tt> buffer index<br><br>Returns the current caret position in the buffer.<br>The caret position is used for reading and writing to the buffer.<br>Buffers are automatically expanded when the write operation exceeds the current buffer length.","<tt>id:</tt> buffer index<br><br>Decompresses a buffer using zlib.","<tt>id:</tt> buffer index<br><tt>filename:</tt> file to load from<br><tt>Returns:</tt> buffer id<br><br>Loads the entire file into the buffer, resizing it to fit. Sets the caret to the start.","<tt>id:</tt> buffer index<br><tt>filename:</tt> file to load from<br><tt>pos/len:</tt> part of the file to load<br><tt>Returns:</tt> whether the read was successful<br><br>Loads part of a file into a buffer, resizing it to fit. Sets the caret to the start.","<tt>id:</tt> buffer to use<br><tt>Returns:</tt> pipe name<br><br>Creates a single-use pipe using the buffer's data. Currently, this is only usable with d3d_model_load, due to some implementation details.<br>This may be expandable in the future.","<tt>id:</tt> buffer index<br><tt>pos:</tt> position to read<br><tt>Returns:</tt> byte at position in the buffer<br><br>Reads a single byte from the buffer without moving the caret.","<tt>id:</tt> buffer index<br><tt>pos:</tt> position to read<br><tt>value:</tt> value to write<br><br>Writes a single byte to a location in the buffer without moving the caret.","<tt>id:</tt> buffer index<br><tt>key:</tt> password to use<br><br>Scrambles a buffer using a rotating cypher. Apply the same password again to unscramble.","<tt>id:</tt> buffer index<br><tt>idkey:</tt> buffer to use as password<br><br>Scrambles a buffer using a rotating cypher. Apply the same password again to unscramble.","<tt>id:</tt> buffer index<br><tt>len:</tt> length in bytes<br><tt>Returns:</tt> string<br><br>Reads an amount of arbitrary character data as a string from the buffer.<br>This will read non-printing characters correctly.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a double (53 bits of precision, eight bytes).<br>This is the most accurate way to store GML Real numbers in a buffer.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a float (24 bits of precision, four bytes).","<tt>id:</tt> buffer index<br><tt>len:</tt> length in bytes<br><tt>Returns:</tt> string<br><br>Reads an amount of expanded hex-codes from the buffer as a string.<br>This will deconvert the binary data to readable hex codes. For example, \"cat\" in the buffer becomes \"636174\" when read.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a signed short (-32768 to 32767, two bytes).","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a signed long (-2147483648 to 2147483647, four bytes).","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a signed long long (-9223372036854775808 to 9223372036854775807, eight bytes).<br>Note that integers above 2^53 (9007199254740992) cannot accurately be represented in a double,<br>and as such, may lose precision when handled in GML.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads a signed char (-128 to 127, one byte).","<tt>id:</tt> buffer index<br><tt>Returns:</tt> string<br><br>Reads a null-terminated string from the buffer.","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads an unsigned short (0 to 65535, two bytes).","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads an unsigned long (0 to 4294967295, four bytes).","<tt>id:</tt> buffer index<br><tt>Returns:</tt> value<br><br>Reads an unsigned long long (0 to 18446744073709551615, eight bytes).<br>Note that integers above 2^53 (9007199254740992) cannot accurately be represented in a double,<br>and as such, may lose precision when handled in GML.","<tt>id:</t ecision, four bytes) to the buffer.<br>Designed for use with vertex buffers.","<tt>id:</tt> buffer index<br><tt>val1,2,3,4:</tt> values to write<br><br>Writes four floats (24 bits of precision, four bytes) to the buffer.<br>Designed for use with vertex buffers.","<tt>id:</tt> buffer index<br><tt>string:</tt> string to write<br><br>Writes a string of expanded hex-codes to the buffer as data.<br>This will convert the hex codes in the string into binary data. For example, \"636174\" becomes \"cat\" in the buffer.","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes a signed short (-32768 to 32767, two bytes).","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes a signed long (-2147483648 to 2147483647, four bytes).","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes a signed long long (-9223372036854775808 to 9223372036854775807, eight bytes).<br>Note that integers above 2^53 (9007199254740992) cannot accurately be represented in a double,<br>and as such, may lose precision when handled in GML.","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes a signed char (-128 to 127, one byte).","<tt>id:</tt> buffer index<br><tt>string:</tt> string to write<br><br>Writes a null-terminated string to the buffer.<br>If your string contains null characters, it is advisable to instead write its length first and then use buffer_read/write_data().","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes an unsigned short (0 to 65535, two bytes).","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes an unsigned long (0 to 4294967295, four bytes).","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes an unsigned long long (0 to 18446744073709551615, eight bytes).<br>Note that integers above 2^53 (9007199254740992) cannot accurately be represented in a double,<br>and as such, may lose precision when handled in GML.","<tt>id:</tt> buffer index<br><tt>value:</tt> value to write<br><br>Writes an unsigned byte (0 to 255, one byte).","<tt>id:</tt> buffer id<br><tt>value:</tt> value to write<br><br>Writes the contents of a variable to a buffer. This is useful if the variable may contain either a real or a string.<br>This method of storage uses 9 bytes for a number, and string length+2 for strings.","<tt>buffer:</tt> buffer to hash<br><br>Returns the CRC32 hash of the buffer contents.","<tt>buffer:</tt> buffer to hash<br><tt>pos,len:</tt> part of buffer to hash<br><br>Returns the CRC32 hash of part of the buffer contents.","<tt>filename:</tt> file to hash<br><br>Returns the CRC32 hash of the file contents.","<tt>string:</tt> string to hash<br><br>Returns the CRC32 hash of the string.","<tt>id:</tt> listener index<br><br>Connects an incoming client to a socket, completing the connection.","Creates and returns a new listener.<br>Listeners react to incoming connections, and are needed to connect sockets.","<tt>id:</tt> listener index<br><br>Destroys a listener.","<tt>id:</tt> listener index<br><br>Returns whether the listener with id exists.","<tt>id:</tt> listener index<br><br>Returns whether the listener with id is listening to incoming connections.","<tt>id:</tt> listener index<br><br>Returns whether a connection attempt is pending.<br>Use listener_accept() to accept a connection.","<tt>id:</tt> listener index<br><tt>ipv6:</tt> whether to use ipv6, or default to ipv4<br><tt>port:</tt> port number to listen in<br><tt>local:</tt> whether to skip firewall warnings and expect only connections from this computer<br><br>Starts listening for incoming connections from other clients.","<tt>id:</tt> listener index<br><br>Stops listening for incoming connections.","<tt>buffer:</tt> buffer to hash<br><br>Returns the MD5 hash of the buffer contents.","<tt>buffer:</tt> buffer to hash<br><tt>pos,len:</tt> part of buffer to hash<br><br>Returns the MD5 hash of part of the buffer contents.","<tt>filename:</tt> file to hash<br><br>Returns the MD5 hash of the file contents.","<tt>string:</tt> string to hash<br><br>Returns the MD5 hash of the string.","<tt>buffer:</tt> buffer to hash<br><br>Returns the SHA1 hash of the buffer contents.","<tt>buffer:</tt> buffer to hash<br><tt>pos,len:</tt> part of buffer to hash<br><br>Returns the SHA1 hash of part of the buffer contents.","<tt>filename:</tt> file to hash<br><br>Returns the SHA1 hash of the file contents.","<tt>string:</tt> string to hash<br><br>Returns the SHA1 hash of the string.","<tt>id:</tt> socket index<br><br>Shuts down the socket after all data has been sent.<br>You can use this function to gracefully close a connection while guaranteeing that all data that is sent will actually arrive at the other side.<br>After all the data has been received by the other side, the state of the socket at the other side will change to tcp_closed.<br>The other side should respond to this by either calling socket_close as well, or simply destroying the socket, which will change the state of this socket to tcp_closed as well.","<tt>id:</tt> socket index<br><tt>address:</tt> address to connect<br><tt>port:</tt> port number to use<br><br>Connects the socket. Use socket_get_state() to check how the connection proceeds.","Creates a new socket and returns the id.","<tt>id:</tt> socket index<br><br>Returns whether a socket with the given id exists.","<tt>id:</tt> socket index<br><br>Returns the IP address of the computer this socket is connected to.<br>This function does not work if the socket is still connecting - wait until socket_get_state returns tcp_connected (2).","<tt>id:</tt> socket index<br><br>Returns the length of the data that has been received but not read yet.","<tt>id:</tt> socket index<br><br>Returns the length of the data that has been written but not sent yet.","<tt>id:</tt> socket index<br><tt>Returns:</tt> state constant<br><br>0 = tcp_offline (the socket is not connected)<br>1 = tcp_connecting (the socket is still trying to connect ry.","<tt>Returns:</tt> array[3] with projection's 'from' coordinates","<tt>index:</tt> light number 0-7<br><tt>type:</tt> one of lt_point, lt_spotlight, or lt_sun<br><tt>x,y,z:</tt> light position (unused for sun lights)<br><tt>dx,dy,dz:</tt> direction vector (unused for point lights)<br><tt>range:</tt> maximum light range (unused for sun lights)<br><tt>inner_rad:</tt> inner aperture angle of spotlights (unused for sun and point)<br><tt>outer_rad:</tt> outer penumbra angle of spotlights (unused for sun and point)<br><tt>color_diffuse:</tt> light color<br><tt>diffuse_factor:</tt> light scaling factor, default 1. can be used for cool effects f.ex. larger values cause \"cel shading\".<br><tt>color_specular:</tt> specular highlight color. Used for shiny reflections. Set to black to disable.<br><tt>specular_factor:</tt> exponent factor for specular highlights. Use values between 10 and 50 depending on the intended effect.","<tt>Returns:</tt> whether the light with index is enabled.","","Adds a model to a bundle, with a background texture.","Creates and returns an empty model bundle.","Destroys a bundle, freeing any resources associated with it.","Draws a model bundle.","Loads a model bundle from disk.","Loads a model bundle from a buffer.","Saves a model bundle to disk.","Saves a model bundle to a buffer.","","","","<tt>x,y,z:</tt> input coordinates in 3d space<br><tt>Returns:</tt> array[3] with view-space coordinates<br><br>This function will take the 3d object-space coordinates and apply the<br>current view-proj-matrix to it, returning a 2d view-space coordinate<br>(multiply by your resolution to get screen coordinates).<br>The z coordinate tells you that the point is not behind the camera.","","","Sets the alpha test reference value and comparison mode. Valid comparison modes include:<br><tt>cm_less:</tt> Draws pixels if the alpha value is less than the ref value.<br><tt>cm_equal:</tt> Draws pixels if the alpha value is equal to the ref value.<br><tt>cm_lessequal:</tt> Draws pixels if the alpha value is less or equal to the ref value.<br><tt>cm_greater:</tt> Draws pixels if the alpha value is greater than the ref value.<br><tt>cm_greaterequal:</tt> Draws pixels if the alpha value is greater or equal to the ref value.<br><tt>cm_notequal:</tt> Draws pixels if the alpha value is different to the ref value.","<tt>red,green,blue,alpha:</tt> true/false<br><br>Enables or disables writing to each color channel when drawing.","Sets the backface culling method. Valid methods include:<br><tt>cull_clockwise:</tt> Draw faces with clockwise pixel definition.<br><tt>cull_counterclockwise:</tt> Draw faces with counterclockwise vertex definition.<br><br>cull_none: Draw both faces.","<tt>mode:</tt> fill_ constant<br>Sets the polygon fill mode. Valid modes include:<br><tt>fill_normal:</tt> Draw polygons normally.<br><tt>fill_points:</tt> Draw only the vertices as points.<br><br>fill_wireframe: Draw edges as lines.","<tt>type:</tt> fog_ constants<br><tt>color:</tt> gm color<br><tt>start,end:</tt> fog distance<br>Sets the fog mode. Valid types include:<br><tt>fog_none:</tt> Disable fog.<br><tt>fog_table:</tt> Use table fog based on fragment w value. The default fog mode.<br><tt>fog_vertex:</tt> Use spherical vertex distance-based fog. Looks better, but needs small polygons to work correctly.","","Sets the zbias value used to sort polygons that are close to each other.<br>The zbias is added to fragment depth when computing overlap, to help polygons sort in front or behind of other polygons.<br>The unit for zbias is in frustum size, so if your znear is 1 and zfar is 1000, then to get a zbias of 1 pixel you would set it to 1/999.","Sets the z comparison mode when drawing pixels. Valid comparison modes include:<br><tt>cm_less:</tt> Draws pixels if the z value is less than the zbuffer value.<br><tt>cm_equal:</tt> Draws pixels if the z value is equal to the zbuffer value.<br><tt>cm_lessequal:</tt> Draws pixels if the z value is less or equal to the zbuffer value. This is the default mode.<br><tt>cm_greater:</tt> Draws pixels if the z value is greater than the zbuffer value.<br><tt>cm_greaterequal:</tt> Draws pixels if the z value is greater or equal to the zbuffer value.<br><tt>cm_notequal:</tt> Draws pixels if the z value is different to the zbuffer value.","These functions will apply many transforms at once. The letters at the end of the function etermine which transforms can be applied:<br>xyz - rotations<br>s - scale<br>t - transform<br>The transformations are applied in the order of the letters.","<tt>arguments:</tt> matrix components<br><br>Sets the World matrix directly.","<tt>x,y,z:</tt> input coordinates in 3d space<br><tt>Returns:</tt> array[3] with transformed world coordinates<br><br>This function will take the 3d object-space coordinates and apply the<br>current world-matrix to it.","","","<tt>grid:</tt> grid to store the surface contents in.<br><tt>surface:</tt> a surface to get the contents from.<br><br>This function will retrieve the surface's color data into a ds_grid.<br>Each pixel is stored as a color value.<br>The grid will be resized to fit the surface's contents.<br>If 'noone' is passed as a grid, one will be created.","","","","","","","","","","","","","","","","","","","","","","","","","","","","","Discards the surface backup, freeing all memory used.","Backs up all surfaces to memory.<br>The backup is persistent and can be reused multiple times.<br>The function returns the number of surfaces that have been backed.","Returns the number of surfaces backed up, or 0 if none.","Loads the surface backup from disk.","Restores a surface backup into video memory. All surfaces are restored to their original ids.<br>Surfaces that were not backed up are destroyed.","Saves the surface backup to disk.","","","","Frees all surfaces.","","<tt>surface:</tt> surface id<br><tt>Returns:</tt> 32 bit address of the IDirect3DSurface9 structure associated with the surface.","","","","","","<tt>name:</tt> name of the surface to resize<br><tt>w,h:</tt> new dimensions to resize to<br><tt>scale:</tt> whether to scale the image to fit the new surface<br><tt>filter:</tt> whether to use a bilinear filter when scaling the image<br><tt>Returns:</tt> id of the new surface generated for the resize operation","","Sets the depth buffer to use a different surface.","","","","","","","","","","","","","","","","","","","","<tt>w,h:</tt> window size<br><tt>reset:</tt> whether to reset the device<br><tt>aa:</tt> antialias value for device reset<br><br>Call this with reset true at least once in game start.","exclusive fullscreen<br><tt>warning:</tt> VERY buggy"],["Returns the absolute value of x.","Returns a string containing the character with raw BYTE value set.","Returns the inverse cosine of x.","Returns the inverse sine of x.","Returns the inverse tangent of x.","Adds the image stored in the file fname to the set of background resources. Many different types of images can be dealt with. When the image has an alpha channel, this is used for transparency. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the boundaries. The function returns the index of the new background that you can then use to draw it or to assign it to the variable background_index[0] to make it visible in the current room. When an error occurs -1 is returned.","Adds the background stored the file fname to the set of background resources. The file must be a .gmbck file that is saved in the background property form in <i>Game Maker</i>. As this file contains all background settings, no further arguments are required. The function returns the index of the new background that you can then use to draw it or to assign it to the variable background_index[0] to make it visible in the current room. When an error occurs -1 is returned.","Assigns the indicated background to background ind. So this makes a copy of the background.","Creates a background of the given size and with the given color. It returns the index of the new background. When an error occurs -1 is returned.","Creates a background by copying the given area from the screen. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the boundaries. This function makes it possible to create any background you want. Draw the image on the screen using the drawing functions and next create a background from it. (If you don't do this in the drawing event you can even do it in such a way that it is not visible on the screen by not refreshing the screen.) The function returns the index of the new background. A work of caution is required here. Even though we speak about the screen, it is actually the drawing region that matters. The fact that there is a window on the screen and that the image might be scaled in this window does not matter.","Creates a background by copying the given area from the surface with the given id. <tt>removeback</tt> indicates whether to make all pixels with the background color (left-bottom pixel) transparent. <tt>smooth</tt> indicates whether to smooth the boundaries. This function makes it possible to create any background you want. Draw the image on the surface using the drawing functions and next create a background from it. Note that alpha values are maintained in the background.","Deletes the background from memory, freeing the memory used.","Creates a duplicate of the background with the given index. It returns the index of the new background. When an error occurs -1 is returned.","Returns whether a background with the given index exists.","Returns the height of the background with the given index.","Returns the name of the background with the given index.","Returns the id of the texture corresponding to the indicated background.","Returns the width of the background with the given index.","Same as above but in this case the background with index ind is replaced. The function returns whether it is successful. When the background is currently visible in the room it wil be replaced also.","Same as above but in this case the background with index ind is replaced. The function returns whether it is successful. When the background is currently visible in the room it wil be replaced also.","Saves the background ind to the file with the name fname. This must be a .png file. <b><i>Only available in the Standard Edition.</i></b>","Changes the alpha (transparancy) values in the background with index <tt>ind</tt> using the intensity values in the background <tt>back</tt>. This cannot be undone.","Closes the door of the CD player.","Must be called before using the other functions. Should also be called when a CD is changed (or simply from time to time).","Returns the length of the total CD in milliseconds.","Returns the number of tracks on the CD.","Opens the door of the CD player.","Pauses the playing.","Returns whether the CD is paused or stopped.","Tells the CD to play tracks first until last. If you want to play the full CD give 1 and 1000 as arguments.","Returns whether the CD is playing.","Returns the current position on the CD in milliseconds.","Returns whether a CD is present in the default CD drive.","Resumes the playing.","Sets the position on the CD in milliseconds.","Sets the position in the current track in milliseconds.","Stops playing.","Returns the number of the current track (1=the first).","Returns the length of track n of the CD in milliseconds.","Returns the current position in the track being played in milliseconds.","Returns the ceiling of x, that is, x rounded up to an integer.","Returns a string containing the character with code val for printing/displaying based on the current drawing font's character set codepage.","Returns the current text on the clipboard.","Returns whether there is any text on the clipboard.","Sets the string str on the clipboard.","This function tests whether there is a collision between the (filled) circle centered at position (xc,yc) with the given radius and entities of object obj. For example, you can use this to test whether there is an object close to a particular location.","This function tests whether at point (x,y) there is a collision with entities of object obj.","Returns the blue component of the color.","Returns the green component of the color.","Returns the hue component of the color.","Returns the red component of the color.","Returns the saturation component of the color.","Returns the value component of the color.","Returns the cosine of x (x in radians).","Creates a date-time value corresponding to the indicated date.","Creates a date-time value corresponding to the indicated date and time.","Creates a date-time value corresponding to the indicated time.","Returns the date-time value that corresponds to the current date only (ignoring the time).","Returns the date-time value that corresponds to the current moment.","Returns the date-time value that corresponds to the current time only (ignoring the date).","Returns the date part of the indicated date-time value, setting the time part to 0.","Returns a string indicating the given date in the default format for the system.","Returns a string indicating the given date and time in the default format for the system.","Returns the number of days in the month indicated by the date-time value.","Returns the number of days in the year indicated by the date-time value.","Returns the day of the month corresponding to the date.","Returns the day of the year corresponding to the date.","Returns the hour corresponding to the date.","Returns the hour of the year corresponding to the date.","Returns the minute corresponding to the date.","Returns the minute of the year corresponding to the date.","Returns the month corresponding to the date.","Returns the second corresponding to the date.","Returns the second of the year corresponding to the date.","Returns the week of the year corresponding to the date.","Returns the day of the week corresponding to the date.","Returns the year corresponding to the date.","Returns a new date that is amount days after the indicated date. amount must be an integer number.","Returns a new date that is amount hours after the indicated date. amount must be an integer number.","Returns a new date that is amount minutes after the indicated date. amount must be an integer number.","Returns a new date that is amount months after the indicated date. amount must be an integer number.","Returns a new date that is amount seconds after the indicated date. amount must be an integer number.","Returns a new date that is amount weeks after the indicated date. amount must be an integer number.","Returns a new date that is amount years after the indicated date. amount must be an integer number.","Returns whether the indicated date-time value is on today.","Returns whether the year indicated by the date-time value is a leap year.","Returns the time part of the indicated date-time value, setting the date part to 0.","Returns a string indicating the given time in the default format for the system.","Returns whether the indicated date is valid.","Returns whether the indicated date and time are valid.","Returns whether the indicated time is valid.","Converts degrees to radians.","Creates a directory with the given name (including the path towards it) if it does not exist. The name must include the full path, not a relative path.","Returns whether the indicated directory does exist. The name must include the full path, not a relative path.","Discard the included file with the name fname, freeing the memory used. This must be a string variable, so don't forget the quotes.","Returns the amount of free space on the indicated drive in bytes. <tt>drive</tt> must be a capital letter, e.g. 'C'. If you do not provide the drive, the drive of the current working directory is used.","Returns the color depth in bits.","Returns the refresh frequency of the display.","Returns the height of the display in pixels.","Returns the width of the display in pixels.","Returns the x-coordinate of the mouse on the display.","Returns the y-coordinate of the mouse on the display.","Sets the position of the mouse on the display to the indicated values.","Sets all at once. Use -1 for values you do not want to change. Returns whether successful.","Sets the color depth. In general only 16 and 32 are allowed values. Returns whether successful.","Sets the refresh frequency for the display. Only few frequencies are allowed. Typically you could set this to 60 with a same room speed to get smooth 60 frames per second motion. Returns whether successful.","Sets the width and height of the display in pixels. Returns whether this was successful. (Realize that only certain combinations are allowed.)","Tests whether the indicated settings are allowed. It does not change the settings. Use -1 for values you do not want to change. Returns whether the settings are allowed.","Returns the distance of the instance to the nearest instance of object obj. (If the instance or object does not have a sprite or mask, the result of the function is undefined.)","Returns the distance of the bounding box of the current instance to (x,y). (If the instance does not have a sprite or mask, the result of the function is undefined.)","Draws the background at position (x,y). (Without color blending and no alpha transparency.)","Draws the background scaled and rotated with blending color (use c_white for no blending) and transparency alpha (0-1).","Draws the indicated part of the background with the top-left corner of the part at position (x,y).","Draws the indicated part of the background with the top-left corner of the part at position (x,y) but now with scale factors and a color and transparency setting.","Draws the background stretched to the indicated region.","Draws the background stretched to the indicated region. color is the blending color and alpha indicates the transparency setting.","Draws the background tiled so that it fills the entire room.","Draws the background tiled so that it fills the entire room but now with scale factors and a color and transparency setting.","Draws a circle at (x,y) with radius r. <tt>outline</tt> indicates whether only the outline must be drawn (true) or it should be filled (false).","Clears the entire room in the given color (no alpha blending).","Clears the entire room in the given color and alpha value (in particular useful for surfaces).","Returns the alpha value used for drawing primitives.","Returns the drawing color used for drawing primitives.","Returns the color of the pixel corresponding to position (x,y) in the room. This is not very fast, so use with care.","With this function you can draw the indicated path in the room with its start at position (x,y). If absolute is true the path is drawn at the position where it was defined and the values of x and y are ignored.","Draws a point at (x,y) in the current color.","Start a primitive of the indicated kind.","Start a primitive of the indicated kind with the given texture.","End the description of the primitive. This function actually draws it.","End the description of the primitive. This function actually draws it.","This command is exactly the same as <tt><b>draw_sprite_ext()</b></tt> except it will use the instances own variables to draw itself (x,y, scale, angle etc.) This provides the same action as if the instance was draw without a script.","Sets the alpha transparency value to be used from now on for drawing primitives. Should lie in the range 0-1. 0 is fully transparent, 1 is fully opaque.","<tt>Indicates what blend mode to use. The following values are possible:</tt> <tt>bm_normal</tt>, <tt>bm_add</tt>, <tt>bm_subtract</tt>, and <tt>bm_max</tt>. Don't forget to reset the mode to normal after use because otherwise also other sprites and even the backgrounds are drawn with the new blend mode.","<tt><tt><tt><tt><tt><tt><tt><tt><tt><tt><tt><tt><tt>Indicates what blend mode to use for both the source and destination color. The new color is some factor times the source and another factor times the destination. These factors are set with this function. To understand this, the source and destination both have a red, green, blue, and alpha component. So the source is (Rs, Gs, Bs, As) and the destination is (Rd, Gd, Bd, Ad). All are considered to lie between 0 and 1. The blend factors you can choose for source and destination are:</tt> <ul> <li>bm_zero:</tt> Blend factor is (0, 0, 0, 0). <li>bm_one:</tt> Blend factor is (1, 1, 1, 1). <li>bm_src_color:</tt> Blend factor is (Rs, Gs, Bs, As). <li>bm_inv_src_color:</tt> Blend factor is (1�Rs, 1�Gs, 1�Bs, 1�As). <li>bm_sr</tt>c_alpha: Blend factor is (As, As, As, As). <li>bm_inv_sr</tt>c_alpha: Blend factor is (1�As, 1�As, 1�As, 1�As). <l</tt>i>bm_dest_alpha: Blend factor is (Ad, Ad, Ad, Ad). <li>bm</tt>_inv_dest_alpha: Blend factor is (1�Ad, 1�Ad, 1�Ad, 1�</tt>�</tt>Ad). <li>bm_dest_color: Blend factor is (Rd, Gd, Bd, Ad).</tt> <li>bm_inv_dest_color: Blend factor is (1�Rd, 1�Gd, 1�Bd,</tt> 1�Ad). <li>bm_src_alpha_sat: Blend factor is (f, f, f, 1); f = min(As, 1�Ad). </ul> For example, the normal blending mode sets the source blending to bm_src_alpha and the destination blending to bm_inv_src_alpha. Don't forget to reset the mode to normal after use because otherwise also other sprites and even the backgrounds are drawn with the new blend mode.","Sets the precision with which circles are drawn, that is, the number of segments they consist of. The precision must lie between 4 and 64 and must be dividable by 4. This is also used for drawing ellipses and rounded rectangles.","Sets the drawing color to be used from now on for drawing primitives.","Sets the font that will be used when drawing text. Use -1 to set the default font (Arial 12).","<tt>Sets the horizontal alignment used when drawing text. Choose one of the following constants as values:</tt> <p> <blockquote> <tt><b>fa_left</b></tt>","<tt>Sets the vertical alignment used when drawing text. Choose one of the following constants as values:</tt> <p> <blockquote> <tt><b>fa_top</b></tt>","Draws subimage subimg (-1 = current) of the sprite with its origin at position (x,y). (Without color blending and no alpha transparency.)","Draws the sprite scaled with factors xscale and yscale and rotated counterclockwise over rot degrees. color is the blending color (use c_white for no blending) and alpha indicates the transparency factor with which the images is merged with its background. A value of 0 makes the sprite completely transparent. A value of 1 makes it completely solid. This function can create great effect (for example partially transparent explosions).","Draws the indicated part of subimage subimg (-1 = current) of the sprite with the top-left corner of the part at position (x,y).","Draws the indicated part of subimage subimg (-1 = current) of the sprite with the top-left corner of the part at position (x,y) but now with scale factors and a color and transparency setting.","Draws the sprite stretched so that it fills the region with top-left corner (x,y) and width w and height h.","Draws the sprite stretched so that it fills the region with top-left corner (x,y) and width w and height h. color is the blending color and alpha indicates the transparency setting.","Draws the sprite tiled so that it fills the entire room. (x,y) is the place where one of the sprites is drawn.","Draws the sprite tiled so that it fills the entire room but now with scale factors and a color and transparency setting.","Draws the surface at position (x,y). (Without color blending and no alpha transparency.)","Draws the surface scaled and rotated with blending color (use c_white for no blending) and transparency alpha (0-1).","Draws the indicated part of the surface with its origin at position (x,y).","Draws the indicated part of the surface with its origin at position (x,y) but now with scale factors and a color and transparency setting.","Draws the surface stretched to the indicated region.","Draws the surface stretched to the indicated region. color is the blending color and alpha indicates the transparency setting.","Draws the surface tiled so that it fills the entire room.","Draws the surface tiled so that it fills the entire room but now with scale factors and a color and transparency setting.","Draws the string at position (x,y), using the drawing color and alpha. A <br> symbol or carriage return chr(13) or linefeed chr(10) are interpreted as newline characters. In this way you can draw multi-line texts. (Use \<br> to get the <br> symbol itself.)","Similar to the previous routine but you can specify two more things. First of all, <tt>sep</tt> indicates the separation distance between the lines of text in a multiline text. Use -1 to get the default distance. Use <tt>w</tt> to indicate the width of the text in pixels. Lines that are longer than this width are split- up at spaces or - signs. Use -1 to not split up lines.","Combines the function <tt>draw_text_ext</tt> and <tt>draw_text_transformed</tt>. It makes it possible to draw a multi-line text rotated and scaled.","Draws the string at position (x,y) in the same way as above, but scale it horizontally and vertically with the indicated factors and rotate it counter-clockwise over <tt>angle</tt> degrees.","Add vertex (x,y) to the primitive, using the color and alpha value set before.","Add vertex (x,y) to the primitive, with its own color and alpha value. This allows you to create primitives with smoothly changing color and alpha values.","Add vertex (x,y) to the primitive with position (xtex,ytex) in the texture, blending with the color and alpha value set before. xtex and ytex should normally lie between 0 and 1 but also larger values can be used, leading to a repetition of the texture (see below).","Add vertex (x,y) to the primitive with position (xtex,ytex) in the texture, blending with its own color and alpha value.","Add the value to the indicated cell in the grid with the given id. For strings this corresponds to concatenation.","Add the value to all cells in the disk with center (xm,ym) and radius r.","Clears the grid with the given id, to the indicated value (can both be a number or a string).","Copies the grid source into the grid with the given id.","Creates a new grid with the indicated width and height. The function returns an integer as an id that must be used in all other functions to access the particular grid.","Destroys the grid with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns the value of the indicated cell in the grid with the given id.","Returns the max of the values of the cells in the disk.","Returns the mean of the values of the cells in the disk.","Returns the min of the values of the cells in the disk.","Returns the sum of the values of the cells in the disk.","Returns the height of the grid with the indicated id.","Multiplies the value to the indicated cell in the grid with the given id. Is only valid for numbers.","Multiply the value to all cells in the disk with center (xm,ym) and radius r.","Reads the data structure from the given string (as created by the previous call).","Resizes the grid to the new width and height. Existing cells keep their original value.","Sets the indicated cell in the grid with the given id, to the indicated value (can both be a number or a string).","Sets all cells in the disk with center (xm,ym) and radius r.","Shuffles the values in the grid such that they end up in a random order.","Returns whether the value appears somewhere in the disk.","Returns the x-coordinate of the cell in which the value appears in the disk.","Returns the y-coordinate of the cell in which the value appears in the disk.","Returns the width of the grid with the indicated id.","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Adds the value at the end of the list.","Clears the list with the given id, removing all data from it but not destroying it.","Copies the list source into the list with the given id.","Creates a new list. The function returns an integer as an id that must be used in all other functions to access the particular list.","Deletes the value at position pos in the list. (Position 0 is the first element.)","Destroys the list with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns whether the list is empty. This is the same as testing whether the size is 0.","Find the position storing the indicated value. If the value is not in the list -1 is returned.","Returns the value stored at the indicated position in the list.","Inserts the value at position pos in the list. The first position is 0, the last position is the size of the list minus 1.","Reads the data structure from the given string (as created by the previous call).","Replaces the value at position pos in the list with the new value.","Shuffles the values in the list such that they end up in a random order.","Returns the number of values stored in the list.","Sorts the values in the list. When ascend is true the values are sorted in ascending order, otherwise in descending order.","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Adds the key-value pair to the map.","Clears the map with the given id, removing all data from it but not destroying it.","Copies the map source into the map with the given id.","Creates a new map. The function returns an integer as an id that must be used in all other functions to access the particular map.","Deletes the key and the corresponding value from the map. (If there are multiple entries with the same key, only one is removed.)","Destroys the map with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns whether the map is empty. This is the same as testing whether the size is 0.","Returns whether the key exists in the map.","Returns the smallest key in the map.","Returns the largest key in the map.","Returns the smallest key in the map larger than the indicated key.","Returns the largest key in the map smaller than the indicated key. (Note that the key is returned, not the value. You can use the previous routine to find the value.)","Returns the value corresponding to the key.","Reads the data structure from the given string (as created by the previous call).","Replaces the value corresponding with the key with a new value.","Returns the number of key-value pairs stored in the map.","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Adds the value with the given priority to the priority queue.","Changes the priority of the given value in the priority queue.","Clears the priority queue with the given id, removing all data from it but not destroying it.","Copies the priority queue source into the priority queue with the given id.","Creates a new priority queue. The function returns an integer as an id that must be used in all other functions to access the particular priority queue.","Returns the value with the largest priority and deletes it from the priority queue.","Returns the value with the smallest priority and deletes it from the priority queue.","Deletes the given value (with its priority) from the priority queue.","Destroys the priority queue with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns whether the priority queue is empty. This is the same as testing whether the size is 0.","Returns the value with the largest priority but does not delete it from the priority queue.","Returns the value with the smallest priority but does not delete it from the priority queue.","Returns the priority of the given value in the priority queue.","Reads the data structure from the given string (as created by the previous call).","Returns the number of values stored in the priority queue.","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Clears the queue with the given id, removing all data from it but not destroying it.","Copies the queue source into the queue with the given id.","Creates a new queue. The function returns an integer as an id that must be used in all other functions to access the particular queue. You can create multiple queues.","Returns the value that is longest in the queue and removes it from the queue.","Destroys the queue with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns whether the queue is empty. This is the same as testing whether the size is 0.","Enters the value in the queue.","Returns the value at the head of the queue, that is, the value that has been the longest in the queue. (It does not remove it from the queue.)","Reads the data structure from the given string (as created by the previous call).","Returns the number of values stored in the queue.","Returns the value at the tail of the queue, that is, the value that has most recently been added to the queue. (It does not remove it from the queue.)","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Sets the precision used for comparisons.","Clears the stack with the given id, removing all data from it but not destroying it.","Copies the stack source into the stack with the given id.","Creates a new stack. The function returns an integer as an id that must be used in all other functions to access the particular stack. You can create multiple stacks.","Destroys the stack with the given id, freeing the memory used. Don't forget to call this function when you are ready with the structure.","Returns whether the stack is empty. This is the same as testing whether the size is 0.","Returns the value on the top of the stack and removes it from the stack.","Pushes the value on the stack.","Reads the data structure from the given string (as created by the previous call).","Returns the number of values stored in the stack.","Returns the value on the top of the stack but does not remove it from the stack.","Turns the data structure into a string and returns this string. The string can then be used to e.g. save it to a file. This provides an easy mechanism for saving data structures.","Clears all effects.","Similar to the previous function but this time the effect is created on top of the instances, that is, at a depth of -100000.","<tt>Creates an effect of the given kind (see above) at the indicated position. size give the size as follows:</tt> 0 = small, 1 = medium, 2 = large. color indicates the color to be used. The effect is created below the instances, that is, at a depth of 100000.","<tt>Returns the value (a string) of the environment variable with the given name. </blockquote> <p> Finally, if you are interested in the size of the disk and the free space, you can use the following functions:</tt> </p> <p> <blockquote> <tt><b>disk_size(drive)</b></tt> Returns the size of the indicated drive in bytes. <tt>drive</tt> must be a capital letter, e.g. 'C'. If you do not provide the drive, the drive of the current working directory is used.","Performs the inherited event. This only works if the instance has a parent object.","<tt>Performs event numb of the indicated type to the current instance. The following event types can be indicated:</tt> <p> <blockquote> <tt><b>ev_create</b></tt>","This functions works the same as the function above except that this time you can specify events in another object. Note that the actions in these events are applied to the current instance, not to instances of the given object!","In the other events you can also define 16 user events. These are only performed if you call this function. numb must lie in the range 0 to 15.","Execute the piece of code in the file.","Executes program prog with arguments arg. wait indicates whether to wait for finishing.","Executes the program (or file) in the shell.","Returns e to the power x.","Exports the included file with the name fname. This must be a string variable, so don't forget the quotes.","Exports the included file with the name fname to the given location. Location must contain the path and the filename.","Frees the DLL with the given name. This is in particular necessary if the game should remove the DLL. As long as the DLL is not freed it cannot be removed. Best do this e.g. in an end of game event.","Returns whether the file has all the attributes given in attr. Use a combination of the constants indicated above.","Closes the file with the given file id.","<tt>Opens the file with the indicated name. The mode indicates what can be done with the file:</tt> 0 = reading, 1 = writing, 2 = both reading and writing). When the file does not exist it is created. The function returns the id of the file that must be used in the other functions. You can open multiple files at the same time (32 max). Don't forget to close them once you are finished with them.","Returns the current position (in bytes; 0 is the first position) of the file with the given file id.","Reads a byte of data from the file and returns this.","Rewrites the file with the given file id, that is, clears it and starts writing at the start.","Moves the current position of the file to the indicated position. To append to a file move the position to the size of the file before writing.","Returns the size (in bytes) of the file with the given file id.","Writes a byte of data to the file with the given file id.","Copies the file fname to the newname.","Deletes the file with the given name.","Returns whether the file with the given name exists (true) or not (false).","Must be called after handling all files to free memory.","Returns the name of the first file that satisfies the mask and the attributes. If no such file exists, the empty string is returned. The mask can contain a path and can contain wildchars, for example 'C:\temp\*.doc'. The attributes give the additional files you want to see. (So the normal files are always returned when they satisfy the mask.) You can add up the following constants to see the type of files you want:","Returns the name of the next file that satisfies the previously given mask and the attributes. If no such file exists, the empty string is returned.","Renames the file with name oldname into newname.","Closes the file with the given file id.","Returns whether we reached the end of the file.","Returns whether we reached the end of a line in the file.","Opens the indicated file for appending data at the end, creating it if it does not exist. The function returns the id of the file that must be used in the other functions.","Opens the file with the indicated name for reading. The function returns the id of the file that must be used in the other functions. You can open multiple files at the same time (32 max). Don't forget to close them once you are finished with them.","Opens the indicated file for writing, creating it if it does not exist. The function returns the id of the file that must be used in the other functions.","Reads a real value from the file and returns this value.","Reads a string from the file with the given file id and returns this string. A string ends at the end of line.","Skips the rest of the line in the file and starts at the start of the next line.","Write the real value to the file with the given file id. (As separator between the integer and decimal part always a dot is used.","Writes the string to the file with the given file id.","Write a newline character to the file.","Returns the indicated file name, with the extension (including the dot) changed to the new extension. By using an empty string as the new extension you can remove the extension.","Returns the directory part of the indicated file name, which normally is the same as the path except for the final backslash.","Returns the drive information of the filename.","Returns the extension part of the indicated file name, including the leading dot.","Returns the name part of the indicated file name, with the extension but without the path.","Returns the path part of the indicated file name, including the final backslash.","Returns the floor of x, that is, x rounded down to an integer.","Adds a new font and returns its index, indicating the name, size, whether it is bold or italic, and the first and last character that must be created.","Adds a new font and returns its index. The font is created from a sprite. The sprite should contain a subimage for each character. <tt>first</tt> indicate the index of the first character in the sprite. For example, use <tt>ord('0')</tt> if your sprite only contains the digits. <tt>prop</tt> indicates whether the font is proportional. In a proportional font, for each character the width of the bounding box is used as the character width. Finally, <tt>sep</tt> indicates the amount of white space that must separate the characters horizontally. A typical value would lie between 2 and 8 depending on the font size.<BR> <tt><b>font_replace(ind,name,size,bold,italic,first,last)</b></tt> Replaces the font <tt>ind</tt> with a new font, indicating the name, size, whether it is bold or italic, and the first and last character that must be created.","Deletes the font with the given index, freeing the memory it uses.","Returns whether a font with the given index exists.","Returns whether the font with the given index is bold.","Returns the index of the first character in the font with the given index.","Returns the fontname of the font with the given index.","Returns whether the font with the given index is italic.","Returns the index of the last character in the font with the given index.","Returns the name of the font with the given index.","Replaces the font <tt>ind</tt> with a new sprite-based font.","Returns the fractional part of x, that is, the part behind the decimal dot.","End the game.","Loads the game from the file with name string.","Restart the game.","Saves the game to the file with name string.","Asks the player for a color. defcol is the default color. If the user presses Cancel the value -1 is returned.","Asks for a directory. dname is the default name. If the user presses Cancel an empy string is returned.","An alternative way to ask for a directory. capt is the caption to be show. root is the root of the directory tree to be shown. Use the empty string to show the whole tree. If the user presses Cancel an empy string is returned.","Asks the player in a dialog box for a number. str is the message. def is the default number shown.","<tt>Asks the player for a filename to open with the given filter. The filter has the form 'name1|mask1|name2|mask2|...'. A mask contains the different options with a semicolon between them. * means any string. For example:</tt> 'bitmaps|*.bmp;*.wmf'. If the user presses Cancel an empy string is returned.","Asks for a filename to save with the given filter. If the user presses Cancel an empy string is returned.","Asks the player in a dialog box for a string. str is the message. def is the default value shown.","Adds a player with name str and score numb to the list.","Adds the current score to the highscore list. The player is asked to provide a name.","Clears the highscore list.","Returns the name of the person on the given place (1-10).","Sets the background image to use. <tt>back</tt> must be the index of one of the background resources.","Sets whether the highscore form must have a border or not.","Sets the colors used for the background, the new entry in the table, and the other entries.","Sets the font used for the text in the table. (This is a normal Windows font, not one of the font resources.) You specify the name, size and style (0=normal, 1= bold, 2=italic, 3=bold-italic).","Changes the different default strings used when showing the highscore table. <tt>caption</tt> is the caption of the form. <tt>nobody</tt> is the string used when there is nobody at the particular rank. <tt>escape</tt> is the string at the bottom indicating to press the escape key. You can in particular use this when your game should use a different language.","Shows the highscore table. numb is the new score. If this score is good enough to be added to the list, the player can input a name. Use -1 to simple display the current list.","Returns the score of the person on the given place (1-10). This can be used to draw your own highscore list.","Closes the currently open INI file.","Deletes the indicated key from the indicated section.","Returns whether the indicated key exists in the indicated section.","Opens the INI file with the given name. The ini file must be stored in the same folder as the game!","Reads the real value of the indicated key in the indicated section. When the key or section does not exist the default value is returned.","Reads the string value of the indicated key in the indicated section. When the key or section does not exist the default value is returned.","Deletes the indicated section.","Returns whether the indicated section exists.","Writes the real value for the indicated key in the indicated section.","Writes the string value for the indicated key in the indicated section.","Activates all instances in the room.","Activates all instances in the room of the given object. You can also use all to indicate that all instances must be activated or the id of an instance to activate an individual instance.","Activates all instances in the indicated region. If inside is false the instances completely outside the region are activated.","Changes the instance into obj. perf indicates whether to perform the destroy and creation events.","Creates a copy of the current instance. The argument indicates whether the creation event must be executed for the copy. The function returns the id of the new copy.","Creates an instance of obj at position (x,y). The function returns the id of the new instance.","Deactivates all instances in the room. If notme is true the calling instance is not deactivated (which is normally what you want).","Deactivates all instances in the room of the given object. You can also use all to indicate that all instances must be deactivated or the id of an instance to deactivate an individual instance.","Deactivates all instances in the indicated region (that is, those whose bounding box lies partially inside the region). If inside is false the instances completely outside the region are deactivated. If notme is true the calling instance is not deactivated (which is normally what you want).","Destroys the current instance.","Returns whether an instance of type obj exists. obj can be an object, an instance id, or the keyword all.","Returns the id of the (n+1)'th instance of type obj. obj can be an object or the keyword all. If it does not exist, the special object noone is returned. Note that the assignment of the instances to the instance id's changes every step so you cannot use values from previous steps.","Returns the id of the instance of type obj furthest away from (x,y). obj can be an object or the keyword all.","Returns the id of the instance of type obj nearest to (x,y). obj can be an object or the keyword all.","Returns the number of instances of type obj. obj can be an object or the keyword all.","Returns the id of the instance of type obj met when the current instance is placed at position (x,y). obj can be an object or the keyword all. If it does not exist, the special object noone is returned.","Returns the id of the instance of type obj at position (x,y). When multiple instances are at that position the first is returned. obj can be an object or the keyword all. If it does not exist, the special object noone is returned.","Clears all keyboard and mouse states.","Clears all keyboard and mouse states.","Handle user io, updating keyboard and mouse status.","Handle user io, updating keyboard and mouse status.","Returns a random integer number between 0 and x (inclusive when x is an integer).","Returns whether x is a real value (as opposed to a string).","Returns whether x is a string (as opposed to a real value).","Returns the number of axes of the joystick.","Returns the number of buttons of the joystick.","Returns whether the joystick button is pressed (numb in the range 1-32).","Returns the keycode (vk_numpad1 to vk_numpad9) corresponding to the direction of joystick id (1 or 2).","Returns whether joystick id (1 or 2) exists.","Returns whether the joystick has point-of-view capabilities.","Returns the name of the joystick","Returns the joysticks point-of view position. This is an angle between 0 and 360 degrees. 0 is forwards, 90 to the right, 180 backwards and 270 to the left. When no point-of-view direction is pressed by the user -1 is returned.","Returns the joysticks rudder position (or fourth axis).","Returns the joysticks u-position (or fifth axis).","Returns the joysticks v-position (or sixth axis).","Returns the position (-1 to 1) of the x-axis of joystick id.","Returns the joysticks y-position.","Returns the joysticks z-position (if it has a z-axis).","Returns whether the key with the particular keycode is currently down.","Returns whether the key with the particular keycode is pressed by checking the hardware directly. The result is independent of which application has focus. It allows for a few more checks. In particular you can use keycodes vk_lshift, vk_lcontrol, vk_lalt, vk_rshift, vk_rcontrol and vk_ralt to check whether the left or right shift, control or alt key is pressed.","Returns whether the key with the particular keycode was pressed since the last step.","Returns whether the key with the particular keycode was released since the last step.","Clears the state of the key. This means that it will no longer generate keyboard events until it starts repeating.","Returns the current mapping for key.","Returns whether the numlock is set.","Simulates a press of the key with the indicated keycode.","Simulates a release of the key with the indicated keycode.","Sets (true) or unsets (false) the numlock.","Resets all keys to map to themselves.","Waits till the user presses a key on the keyboard.","Returns the horizontal x-component of the vector determined by the indicated length and direction.","Returns the vertical y-component of the vector determined by the indicated length and direction.","Returns the natural logarithm of x.","Returns the log base n of x.","Returns a color with the indicated hue, saturation and value components (each between 0 and 255).","Returns a color with the indicated red, green, and blue components, where red, green and blue must be values between 0 and 255.","Sets the alpha translucence for the pop-up box for any of the functions above. alpha must lie between 0 (completely translucent) and 1 (not translucent) (only for Windows 2000 or later).","Sets the background image for the pop-up box for any of the functions above. back must be one of the backgrounds defined in the game. Unfortunately, alpha values are not taken into account. However, if the left-bottom pixel has an alpha value of 0, all pixels with that color will be considered transparent.","Sets the sprite used for the buttons in the pop-up box. spr must be a sprite consisting of three images, the first indicates the button when it is not pressed and the mouse is far away, the second indicates the button when the mouse is above it but not pressed and the third is the button when it is pressed. Unfortunately, alpha values are not taken into account. However, if the left-bottom pixel has an alpha value of 0, all pixels with that color will be considered transparent.","Sets the font for the buttons in the pop-up box. style indicates the font style (0=normal, 1=bold, 2=italic, and 3=bold-italic).","Sets the caption for the pop-up box. show indicates whether a border must b e shown (1) or not (0) and str indicates the caption when the border is shown.","Sets the color for the background of the input filed in the pop-up box.","Sets the font for the input field in the pop-up box. style indicates the font style (0=normal, 1=bold, 2=italic, and 3=bold-italic).","Sets the position of the pop-up box on the screen. Use -1, -1 to center the box.","Fixes the size of the pop-up box on the screen. If you choose -1 for the width the width of the image is used. If you choose -1 for the height the height is calculated based on the number of lines in the message.","<tt><tt>This function allows you to specify which character set the dialogs will use. type can be one of:</tt> <blockquote><tt> text_type<br /> button_type<br /> input_type<br /> </tt></blockquote> charset can be one of the standard windows character set types:</tt> <blockquote><tt> ANSI_CHARSET<br/> DEFAULT_CHARSET<br /> EASTEUROPE_CHARSET<br /> RUSSIAN_CHARSET<br /> SYMBOL_CHARSET<br /> SHIFTJIS_CHARSET<br /> HANGEUL_CHARSET<br /> GB2312_CHARSET<br /> CHINESEBIG5_CHARSET<br /> JOHAB_CHARSET<br /> HEBREW_CHARSET<br /> ARABIC_CHARSET<br /> GREEK_CHARSET<br /> TURKISH_CHARSET<br /> VIETNAMESE_CHARSET<br /> THAI_CHARSET<br /> MAC_CHARSET<br /> BALTIC_CHARSET<br /> OEM_CHARSET<br /></tt> </blockquote> <tt><b>message_mouse_color(col)</b></tt> Sets the color of the font for the buttons in the pop-up box when the mouse is above it.","Sets the font for the text in the pop-up box. (This is a normal Windows font, not one of the font resources you can out in your game!) style indicates the font style (0=normal, 1=bold, 2=italic, and 3=bold-italic).","Adds the motion to the current motion (as a vector addition).","Sets the motion with the given speed in direction dir.","Returns whether the mouse button is currently down (use as values <tt>mb_none</tt>, <tt>mb_left</tt>, <tt>mb_middle</tt>, or <tt>mb_right</tt>).","Returns whether the mouse button was pressed since the last step.","Returns whether the mouse button was released since the last step.","Clears the state of the mouse button. This means that it will no longer generate mouse events until the player releases it and presses it again.","Waits till the user presses a mouse button","Returns whether the mouse wheel was moved down since the last step.","Returns whether the mouse wheel was moved up since the last step.","Bounces against all instances, instead of just the solid ones.","Bounces against solid instances, like the corresponding action. adv indicates whether to use advance bounce, that also takes slanted walls into account.","Same as the previous function but this time you stop at a contact with any object, not just solid objects.","Moves the instance in the direction until a contact position with a solid object is reached. If there is no collision at the current position, the instance is placed just before a collision occurs. If there already is a collision the instance is not moved. You can specify the maximal distance to move (use a negative number for an arbitrary distance).","Same as the previous function but this time you move until outside any object, not just solid objects.","Moves the instance in the direction until it no longer lies within a solid object. If there is no collision at the current position the instance is not moved. You can specify the maximal distance to move (use a negative number for an arbitrary distance).","Moves the instance to a free random, snapped position, like the corresponding action.","Snaps the instance, like the corresponding action.","Moves the instances with speed sp toward position (x,y).","Wraps the instance when it has left the room to the other side. <tt>hor</tt> indicates whether to wrap horizontaly and <tt>vert</tt> indicates whether to wrap vertically. <tt>margin</tt> indicates how far the origin of the instance must be outside the room before the wrap happens. So it is a margin around the room. You typically use this function in the Outside event.","Marks the indicated cell as being forbidden. Cell 0,0 is the top left cell.","Marks all cells that intersect an instance of the indicated object as being forbidden. You can also use an individual instance by making obj the id of the instance. Also you can use the keyword <TT><B>all</b></tt> to indicate all instances of all objects. prec indicates whether precise collision checking must be used (will only work if precise checking is enabled for the sprite used by the instance).","Marks all cells that intersect the indicated rectangle as being forbidden.","Mark all cells in the grid to be free.","Clears the indicated cell. Cell 0,0 is the top left cell.","Clears all cells that intersect the indicated rectangle (in room coordinates).","This function creates the grid. It returns an index that must be used in all other calls. You can create and maintain multiple grid structures at the same moment. left and top indicate the position of the top-left corner of the grid. hcells and vcells indicate the number of horizontal and vertical cells. Finally cellwidth and cellheight indicate the size of the cells.","Destroys the indicated grid structure and frees its memory. Don't forget to call this if you don't need the structure anymore.","This function draws the grid with green cells being free and red cells being forbidden. This function is slow and only provided as a debug tool.","Computes a path through the grid. path must indicate an existing path that will be replaced by the computer path. xstart and ystart indicate the start of the path and xgoal and ygoal the goal. allowdiag indicates whether diagonal moves are allowed instead of just horizontal or vertical. The function returns whether it succeeded in finding a path. (Note that the path is independent of the current instance; It is a path through the g rid, not a path for a specific instance.)","This function computes a straight-line path for the instance from its current position to the position (xg,yg) using the indicated step size. It uses steps as in the function <TT>mp_linear_step()</TT>. The indicated path must already exist and will be overwritten by the new path. (See a later chapter on how to create and destroy paths.) The function will return whether a path was found. The function will stop and report failure if no straight path exists between start and goal. If it fails a path is still created that runs till the position where the instance was blocked.","Same as the function above but this time only instances of <tt>obj</tt> are considered as obstacles. <tt>obj</tt> can be an object or an instance id.","This function lets the instance take a step straight towards the indicated position (x,y). The size of the step is indicated by the <TT>stepsize</TT>. If the instance is already at the position it will not move any further. If <TT>checkall</TT> is true the instance will stop when it hits an instance of any object. If it is false it only stops when hitting a solid instance. Note that this function does not try to make detours if it meets an obstacle. It simply fails in that case. The function returns whether or not the goal position was reached.","Same as the function above but this time only instances of <tt>obj</tt> are considered as obstacles. <tt>obj</tt> can be an object or an instance id.","This function computes a path for the instance from its current position and orientation to the position (xg,yg) using the indicated step size trying to avoid collision with obstacles. It uses potential field steps, like in the function <TT>mp_potential_step()</TT> and also the parameters that can be set with <TT>mp_potential_settings()</TT>. The indicated path must already exist and will be overwritten by the new path. (See a later chapter on how to create and destroy paths.) The function will return whether a path was found. To avoid the function continuing to compute forever you need to provide a length factor larger than 1. The function will stop and report failure if it cannot find a path shorter than this factor times the distance between start and goal. A factor of 4 is normally good enough but if you expect long detours you might make it longer. If it fails a path is still created that runs in the direction of the goal but it will not reach it.","Same as the function above but this time only instances of <tt>obj</tt> are considered as obstacles. <tt>obj</tt> can be an object or an instance id.","The previous function does its work using a number of parameters that can be changed using this function. Globally the method works as follows. It first tries to move straight towards the goal. It looks a number of steps ahead which can be set with the parameter <TT>ahead</TT> (default 3). Reducing this value means that the instance will start changing direction later. Increasing it means it will start changing direction earlier. If this check leads to a collision it starts looking at directions more to the left and to the right of the best direction. It does this in steps of size <TT>rotstep</TT> (default 10). Reducing this gives the instance more movement possibilities but will be slower. The parameter <TT>maxrot</TT> is a bit more difficult to explain. The instance has a current direction. <TT>maxrot</TT> (default 30) indicates how much it is allowed to change its current direction in a step. So even if it can move e.g. straight to the goal it will only do so if it does not violate this maximal change of direction. If you make <TT>maxrot</TT> large the instance can change a lot in each step. This will make it easier to find a short path but the path will be uglier. If you make the value smaller the path will be smoother but it might take longer detours (and sometimes even fail to find the goal). When no step can be made the behavior depends on the value of the parameter <TT>onspot</TT>. If <TT>onspot</TT> is true (the default value), the instance will rotate on its spot by the amount indicated with <TT>maxrot</TT>. If it is false it will not move at all. Setting it to false is useful for e.g. cars but reduces the chance of finding a path.","Like the previous function, this function lets the instance take a step towards a particular position. But in this case it tries to avoid obstacles. When the instance would run into a solid instance (or any instance when checkall is true) it will change the direction of motion to try to avoid the instance and move around it. The approach is not guaranteed to work but in most easy cases it will effectively move the instance towards the goal. The function returns whether or not the goal was reached.","Same as the function above but this time only instances of <tt>obj</tt> are considered as obstacles. <tt>obj</tt> can be an object or an instance id.","returns the status of the current connection. 0 = no connection, 1 = IPX connection, 2 = TCP/IP connection, 3 = modem connection, and 4 = serial connection.","sets whether or not to use guaranteed transmission for shared data. guar should either be true (the default) or false.","returns the value in location ind (ind between 0 and 1000000). Initially all values are 0.","write value val (string or real) into location ind (ind between 0 and 1000000).","ends the current connection.","initializes an IPX connection.","initializes a modem connection. initstr is the initialization string for the modem (can be empty). phonenr is a string that conta
